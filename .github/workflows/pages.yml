name: pages

# Publishes the gallery and the generated chart outputs as a website, because
# github.com shows .html files as source code. One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (gallery + generated outputs)
        run: |
          mkdir _site
          cp -r index.html .nojekyll gallery [0-9][0-9]_* _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
