slug": "datashader_timeseries", "title": "Line Density of Many Series (datashader)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "Draws thousands of time series at once by counting how many lines pass through each pixel. The \"spaghetti\" becomes a density field that shows where paths typically go, how wide the spread is, and where unusual paths escape, which thousands of overlapping lines cannot show.", "use": ["Show thousands of simulated paths (Monte Carlo, bootstrap, scenario sets)", "Show many real series at once (all stocks in an index, sensors, user sessions)", "Reveal multimodal outcomes, such as paths that split into two regimes"], "avoid": ["There are fewer than ~50 series (highlight a few and gray the rest)", "Each line's identity matters (density loses identity)"], "engine": "mpl", "real": false, "shapes": ["time", "prices"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/datashader_timeseries.png", "ipynb": "../15_interactive_advanced/datashader_timeseries/datashader_timeseries.ipynb", "py": "../15_interactive_advanced/datashader_timeseries/datashader_timeseries.py", "html": null}, {"slug": "webgl_scatter", "title": "WebGL Scatter (200k interactive points)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An interactive scatter drawn on the GPU (WebGL) instead of as SVG elements, so a browser can pan, zoom and hover over hundreds of thousands of points smoothly. It keeps the individual point and its hover details, which density images like datashader give up.", "use": ["Explore 50k to ~1M points interactively, zooming into dense regions", "Points must stay individually inspectable (hover to see a trade, a customer, a sensor reading)", "Share an exploratory view as a standalone HTML file"], "avoid": ["Millions of points or more (the file gets heavy; aggregate with datashader)", "Static print output (use a density plot)", "Small data (normal SVG scatter is crisper)"], "engine": "plotly", "real": false, "shapes": ["numeric", "categories"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/webgl_scatter.png", "ipynb": "../15_interactive_advanced/webgl_scatter/webgl_scatter.ipynb", "py": "../15_interactive_advanced/webgl_scatter/webgl_scatter.py", "html": "../15_interactive_advanced/webgl_scatter/webgl_scatter.html"}, {"slug": "surface_3d_interactive", "title": "Interactive 3-D Surface (implied volatility)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "A rotatable 3-D surface of a measure over two continuous inputs, here implied volatility over strike and expiry, shown next to a 2-D heatmap of the same grid. The surface gives the overall shape (skew, smile, term structure) at a glance, and the heatmap is where values are actually read.", "use": ["Show the shape of a function of two variables: volatility surfaces, yield/term surfaces, loss landscapes, response surfaces", "The reader can rotate and hover (interactive HTML, notebook)", "Shape matters more than exact values"], "avoid": ["Static images and print: a fixed 3-D view hides parts of the surface and distorts heights (use a heatmap or contour plot)", "Comparing precise values (perspective makes heights unreadable)", "Bars or pies in 3-D: never"], "engine": "plotly", "real": false, "shapes": ["numeric", "prices"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/surface_3d_interactive.png", "ipynb": "../15_interactive_advanced/surface_3d_interactive/surface_3d_interactive.ipynb", "py": "../15_interactive_advanced/surface_3d_interactive/surface_3d_interactive.py", "html": "../15_interactive_advanced/surface_3d_interactive/surface_3d_interactive.html"}];
const FAMILIES = [{"folder": "01_deviation", "name": "Deviation", "n": 6}, {"folder": "02_correlation", "name": "Correlation", "n": 11}, {"folder": "03_ranking", "name": "Ranking", "n": 8}, {"folder": "04_distribution", "name": "Distribution", "n": 12}, {"folder": "05_change_over_time", "name": "Change over time", "n": 17}, {"folder": "06_magnitude", "name": "Magnitude", "n": 12}, {"folder": "07_part_to_whole", "name": "Part-to-whole", "n": 12}, {"folder": "08_spatial", "name": "Spatial", "n": 8}, {"folder": "09_flow", "name": "Flow", "n": 9}, {"folder": "10_finance_investment", "name": "Finance & investment", "n": 37}, {"folder": "11_scientific", "name": "Scientific", "n": 17}, {"folder": "12_machine_learning", "name": "Machine learning", "n": 11}, {"folder": "13_uncertainty", "name": "Uncertainty", "n": 5}, {"folder": "14_bad_vs_good", "name": "Bad vs. good", "n": 10}, {"folder": "15_interactive_advanced", "name": "Interactive, animated & big data", "n": 14}];
const SHAPES = {"categories": "Categories & groups", "numeric": "Numeric variables", "time": "Time series", "prices": "Prices & returns", "geo": "Geographic", "hierarchy": "Hierarchy", "flows": "Flows & networks", "sets": "Sets & overlaps", "text": "Text", "events": "Time-to-event", "model": "Model output", "uncertainty": "Estimates & uncertainty"};
const LEVELS = {"basic": "Basic", "intermediate": "Intermediate", "advanced": "Advanced"};
const REPO = {"owner": "maxyychen", "repo": "visualisation", "branch": "main"};
const $ = (id) => document.getElementById(id);
// On GitHub Pages, open notebooks and scripts on github.com (which renders .ipynb);
// interactive .html pages stay on Pages, where they actually run.
const ON_PAGES = REPO && location.hostname.endsWith(".github.io");
const source = (path) => ON_PAGES
  ? `https://github.com/${REPO.owner}/${REPO.repo}/blob/${REPO.branch}/${path.replace(/^\.\.\//, "")}`
  : path;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let fam = null, shape = null, level = null;
try { fam = sessionStorage.getItem("vizlib-fam"); } catch (e) {}
$("sub").textContent = `${CHARTS.length} chart types in ${FAMILIES.length} families · each with a notebook and a runnable Python script`;

function chips() {
  const all = [{folder: null, name: "All", n: CHARTS.length}, ...FAMILIES];
  $("chips").innerHTML = all.map((f) =>
    `<button class="chip" data-f="${f.folder ?? ""}" aria-pressed="${(f.folder ?? null) === fam}">${esc(f.name)}<span class="n">${f.n}</span></button>`).join("");
}
function levelChips() {
  const all = [[null, "Any"], ...Object.entries(LEVELS)];
  $("levels").innerHTML = all.map(([k, label]) => {
    const n = k ? CHARTS.filter((c) => c.level === k).length : CHARTS.length;
    return `<button class="chip" data-l="${k ?? ""}" aria-pressed="${k === level}">${esc(label)}<span class="n">${n}</span></button>`;
  }).join("");
}
$("levels").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  level = b.dataset.l || null; levelChips(); render();
});
function shapeChips() {
  const all = [[null, "Any"], ...Object.entries(SHAPES)];
  $("shapes").innerHTML = all.map(([k, label]) => {
    const n = k ? CHARTS.filter((c) => c.shapes.includes(k)).length : CHARTS.length;
    return n ? `<button class="chip" data-s="${k ?? ""}" aria-pressed="${k === shape}">${esc(label)}<span class="n">${n}</span></button>` : "";
  }).join("");
}
$("shapes").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  shape = b.dataset.s || null; shapeChips(); render();
});
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  fam = b.dataset.f || null;
  try { fam ? sessionStorage.setItem("vizlib-fam", fam) : sessionStorage.removeItem("vizlib-fam"); } catch (e) {}
  chips(); render();
});

function render() {
  const q = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = CHARTS.filter((c) => {
    if (fam && c.family !== fam) return false;
    if (shape && !c.shapes.includes(shape)) return false;
    if (level && c.level !== level) return false;
    if ($("animated").checked && !c.animated) return false;
    if ($("real").checked && !c.real) return false;
    if ($("alts").checked && !c.alts.length) return false;
    if ($("interactive").checked && !c.html) return false;
    const hay = [c.title, c.familyName, c.purpose, ...c.use, ...c.avoid, c.slug].join(" ").toLowerCase();
    return q.every((w) => hay.includes(w));
  });
  $("count").textContent = `${list.length} shown`;
  $("grid").innerHTML = list.length ? list.map(card).join("") :
    `<p class="empty">No charts match. Try a broader word, or clear the filters.</p>`;
}

function card(c) {
  const badges = [c.level !== "basic" ? c.level : "", c.animated ? "animated" : "", c.real ? "real data" : "",
                  c.alts.length ? "+" + c.alts.join(", ") : "", c.html ? "interactive" : ""]
    .filter(Boolean).map((b) => `<span class="badge">${esc(b)}</span>`).join("");
  const li = (xs) => xs.map((x) => `<li>${esc(x)}</li>`).join("");
  return `<article class="card">
    <div class="thumb"><img loading="lazy" src="${c.thumb}" alt="${esc(c.title)} example"></div>
    <div class="body">
      <div class="fam">${esc(c.familyName)}</div>
      <div class="title">${esc(c.title)}<span class="badges">${badges}</span></div>
      <div class="use">${esc(c.use[0])}</div>
      <details><summary>Purpose &amp; when to use</summary>
        <p>${esc(c.purpose)}</p><h4>Use when</h4><ul>${li(c.use)}</ul><h4>Avoid when</h4><ul>${li(c.avoid)}</ul>
      </details>
      <div class="links"><a href="${source(c.ipynb)}">Notebook</a><a href="${source(c.py)}">Script</a>${c.html ? `<button data-live="${c.slug}">Live</button>` : ""}</div>
    </div></article>`;
}

["q", "real", "alts", "interactive", "animated"].forEach((id) => $(id).addEventListener("input", render));
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-live]"); if (!b) return;
  const c = CHARTS.find((x) => x.slug === b.dataset.live);
  $("dlg-title").textContent = c.title;
  $("dlg-open").href = c.html;
  $("dlg-frame").src = c.html;
  $("dlg").showModal();
});
$("dlg-close").addEventListener("click", () => $("dlg").close());
$("dlg").addEventListener("close", () => { $("dlg-frame").src = "about:blank"; });
chips(); levelChips(); shapeChips(); render();
</script>
