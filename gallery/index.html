ose": "A waterfall that walks from last year's revenue to this year's, one driver at a time: price, volume, product mix, currency and acquisitions. It answers the CFO's question 'why did revenue change?' and separates organic from inorganic and currency effects.", "use": ["Explain the change in revenue, profit or margin between two periods", "Separate organic growth from FX and M&A effects in earnings reviews", "Communicate a budget-vs-actual variance by driver"], "avoid": ["Drivers are not additive or overlap (decompose them consistently first)", "There are more than ~8 drivers (group the small ones into 'Other')", "Truncating the y-axis to exaggerate small steps; choose a period where the drivers are material, or chart the drivers alone"], "engine": "mpl", "real": false, "shapes": ["categories", "flows"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/revenue_bridge.png", "ipynb": "../10_finance_investment/revenue_bridge/revenue_bridge.ipynb", "py": "../10_finance_investment/revenue_bridge/revenue_bridge.py", "html": null}, {"slug": "monte_carlo_wealth", "title": "Monte Carlo Retirement Projection", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Simulates thousands of possible market paths for a portfolio with withdrawals, then shows the spread of outcomes as a percentile fan and the probability that the money lasts to each age. It replaces a single misleading 'expected' line with a range and a probability.", "use": ["Retirement or endowment planning with regular withdrawals", "Communicate the risk of running out of money rather than an average outcome", "Compare plans (spending levels, allocations) by their probability of success"], "avoid": ["Presenting the median path as a forecast", "Hiding the return and inflation assumptions; results are only as good as these inputs", "Drawing all simulated paths (spaghetti); show percentile bands and a few sample paths"], "engine": "mpl", "real": false, "shapes": ["time", "uncertainty"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/monte_carlo_wealth.png", "ipynb": "../10_finance_investment/monte_carlo_wealth/monte_carlo_wealth.ipynb", "py": "../10_finance_investment/monte_carlo_wealth/monte_carlo_wealth.py", "html": null}, {"slug": "compounding_dca", "title": "Lump Sum vs Dollar-Cost Averaging vs Cash", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Compares investing a sum all at once, spreading it over twelve months (dollar-cost averaging), and leaving it in cash. One example path shows compounding over time, and a histogram across thousands of simulated markets shows how often each choice wins and by how much.", "use": ["Investor education on compounding and on the cost of waiting in cash", "Frame the lump-sum vs DCA decision as a distribution of outcomes, not one anecdote", "Show the effect of time in the market on long horizons"], "avoid": ["Showing a single historical or simulated path as proof; one path is an anecdote", "Comparing strategies with different total contributions without saying so"], "engine": "mpl", "real": false, "shapes": ["prices", "time", "uncertainty"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/compounding_dca.png", "ipynb": "../10_finance_investment/compounding_dca/compounding_dca.ipynb", "py": "../10_finance_investment/compounding_dca/compounding_dca.py", "html": null}, {"slug": "correlation_network_mst", "title": "Correlation Network (Minimum Spanning Tree)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Turns a correlation matrix of many assets into a tree. Each correlation becomes a distance d = √(2(1 − ρ)), and the minimum spanning tree keeps only the strongest links that connect every asset (Mantegna 1999). A 600-cell heatmap becomes a readable map of which stocks move together, which clusters exist, and which names sit at the centre of the market.", "use": ["Find clusters and \"hub\" stocks in a universe of 20–200 assets", "Check whether sector labels match how stocks actually trade", "Explain portfolio concentration (many holdings on one branch = one bet)"], "avoid": ["There are fewer than ~10 assets (a correlation heatmap is clearer)", "Readers need exact correlation values (the tree drops most pairs)", "The return window is short or crosses a regime change (the tree is unstable)"], "engine": "mpl", "real": false, "shapes": ["prices", "flows"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/correlation_network_mst.png", "ipynb": "../10_finance_investment/correlation_network_mst/correlation_network_mst.ipynb", "py": "../10_finance_investment/correlation_network_mst/correlation_network_mst.py", "html": null}, {"slug": "hrp_dendrogram", "title": "Hierarchical Risk Parity (Dendrogram + Weights)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Shows how hierarchical risk parity (López de Prado, 2016) builds a portfolio. A dendrogram clusters assets by correlation, the reordered correlation matrix shows the clusters as blocks, and the weights panel shows how risk is split across clusters, then within them. The method needs no inversion of the covariance matrix, so it avoids the unstable, concentrated weights of classic mean-variance optimisation.", "use": ["Explain or audit an HRP (or other cluster-based) allocation", "Show the correlation structure of a multi-asset universe", "Compare risk-based weighting schemes side by side"], "avoid": ["The audience only needs the final weights (a simple bar chart)", "There are fewer than ~6 assets (the hierarchy is trivial)"], "engine": "mpl", "real": false, "shapes": ["prices", "hierarchy"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/hrp_dendrogram.png", "ipynb": "../10_finance_investment/hrp_dendrogram/hrp_dendrogram.ipynb", "py": "../10_finance_investment/hrp_dendrogram/hrp_dendrogram.py", "html": null}, {"slug": "regime_shading", "title": "Regime-Shaded Price Chart", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Shades the background of a price chart by the market regime a statistical model infers, here a two-state Markov-switching model of returns (calm vs. turbulent). A lower panel shows the model's probability of being in the turbulent state. Readers see how prices behave inside each regime and how confident the model is, not just where a hand-picked \"crisis\" began.", "use": ["Show when volatility or trend regimes switched, and how long they lasted", "Explain a regime-based strategy (risk-on / risk-off, volatility targeting)", "Put a long price history into context without manual annotation"], "avoid": ["The audience will read the shading as a forecast (it is estimated with hindsight)", "The model has not been validated; shading lends false authority", "There are more than 3 regimes (colors and labels stop being readable)"], "engine": "mpl", "real": false, "shapes": ["prices", "time", "model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/regime_shading.png", "ipynb": "../10_finance_investment/regime_shading/regime_shading.ipynb", "py": "../10_finance_investment/regime_shading/regime_shading.py", "html": null}, {"slug": "event_study", "title": "Event Study (Cumulative Abnormal Returns)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Lines up many events, such as earnings announcements, on a common clock (day 0 = event) and plots the average cumulative abnormal return (CAR): the return beyond what the market model predicts. A confidence band shows whether the reaction is distinguishable from noise. It is the standard way to measure how prices respond to news.", "use": ["Measure the average price reaction to a type of event (earnings, dividends, rate decisions, index inclusion)", "Compare reactions between event groups (beats vs. misses, upgrades vs. downgrades)", "Check for information leakage before the event or drift after it"], "avoid": ["There are only a handful of events (the average is dominated by one case)", "Events overlap in time for the same stock (windows contaminate each other)", "Readers need the reaction of one specific event (plot that stock's returns instead)"], "engine": "mpl", "real": false, "shapes": ["prices", "time", "uncertainty"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/event_study.png", "ipynb": "../10_finance_investment/event_study/event_study.ipynb", "py": "../10_finance_investment/event_study/event_study.py", "html": null}, {"slug": "order_book_depth", "title": "Order Book Depth & Liquidity Heatmap", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Two views of market microstructure. The depth chart shows a single moment: the cumulative size of buy orders (bids) below the price and sell orders (asks) above it, so the spread and the slope of the \"walls\" show how much can trade before the price moves. The liquidity heatmap shows resting order size at every price level over time, with the traded mid-price on top, so persistent walls, pulled orders and price reactions at liquidity become visible.", "use": ["Explain liquidity, spread and market impact to traders or execution analysts", "Spot large resting orders (support/resistance \"walls\") and whether price respects them", "Compare liquidity across venues or times of day"], "avoid": ["The audience only needs price direction (use a price chart)", "The data is aggregated to daily bars (microstructure detail is lost)", "Order-book data is unreliable or spoofed (the chart will look authoritative anyway)"], "engine": "mpl", "real": false, "shapes": ["prices", "numeric", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/order_book_depth.png", "ipynb": "../10_finance_investment/order_book_depth/order_book_depth.ipynb", "py": "../10_finance_investment/order_book_depth/order_book_depth.py", "html": null}, {"slug": "futures_term_structure", "title": "Futures Term Structure (Contango vs. Backwardation)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots futures prices against time to expiry for several dates, alongside the history of the spread between a later contract and the front month. Upward-sloping curves (contango) mean later delivery costs more, usually because of storage and financing. Downward-sloping curves (backwardation) signal scarcity today. The slope drives the roll return of every futures-based investment.", "use": ["Explain roll yield and why commodity ETFs can lag spot prices", "Show how supply shocks flip a market from contango to backwardation", "Compare curve shapes across commodities, VIX futures or rates futures"], "avoid": ["Readers only need the spot price trend", "Contracts have very different liquidity (thin back months distort the curve)"], "engine": "mpl", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/futures_term_structure.png", "ipynb": "../10_finance_investment/futures_term_structure/futures_term_structure.ipynb", "py": "../10_finance_investment/futures_term_structure/futures_term_structure.py", "html": null}, {"slug": "rolling_beta_ci", "title": "Rolling Beta with Confidence Band", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Estimates a stock's or fund's beta to the market over a moving window with a rolling regression, and draws a 95% confidence band around each estimate. Market exposure is not fixed, and a one-year estimate is noisy. The band shows which wiggles are real shifts in exposure and which are estimation error.", "use": ["Monitor whether a fund's market exposure is drifting from its mandate", "Check if a stock became more or less defensive after a business change", "Show why a single \"beta = 1.2\" number can mislead"], "avoid": ["The window is too short for the return frequency (wide bands, little information)", "The relationship is clearly non-linear (options-like payoffs); beta summarises it poorly"], "engine": "mpl", "real": true, "shapes": ["prices", "time", "uncertainty"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/rolling_beta_ci.png", "ipynb": "../10_finance_investment/rolling_beta_ci/rolling_beta_ci.ipynb", "py": "../10_finance_investment/rolling_beta_ci/rolling_beta_ci.py", "html": null}, {"slug": "tail_dependence", "title": "Tail Dependence (Joint Crashes)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Asks whether two assets crash together more often than their ordinary correlation suggests. The scatter highlights the joint-crash quadrant, where both returns are in their worst 5%. The second panel plots the empirical lower-tail dependence, P(B in its worst q | A in its worst q), against the level a Gaussian model with the same correlation would predict. A gap means diversification fails exactly when it is needed.", "use": ["Stress-test a diversification claim (\"they're only 0.4 correlated\")", "Compare copula or risk-model assumptions with the data", "Explain why portfolio losses in crises exceed what normal-distribution models predict"], "avoid": ["Samples are short (tail estimates need many observations; show uncertainty if n is small)", "The audience is unfamiliar with quantiles (start with the scatter only)"], "engine": "mpl", "real": false, "shapes": ["prices", "numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/tail_dependence.png", "ipynb": "../10_finance_investment/tail_dependence/tail_dependence.ipynb", "py": "../10_finance_investment/tail_dependence/tail_dependence.py", "html": null}, {"slug": "kaplan_meier", "title": "Kaplan–Meier Survival Curve", "family": "11_scientific", "familyName": "Scientific", "purpose": "A step function estimating the probability of remaining event-free over time while correctly handling censored subjects, meaning those whose follow-up ended before an event. It is the standard figure for time-to-event outcomes in clinical trials and cohort studies.", "use": ["Compare overall survival, progression-free survival or time-to-relapse between treatment arms or risk groups", "Show any time-to-event outcome with censoring (churn, machine failure, time to readmission)", "Report median survival and survival at landmark times (1-year, 5-year)"], "avoid": ["Survival curves cross substantially (the log-rank test is weak; report RMST or landmark analyses as well)", "There are competing risks (use cumulative incidence functions)", "There are many groups (more than 3–4 curves become unreadable; facet instead)"], "engine": "mpl", "real": false, "shapes": ["events"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/kaplan_meier.png", "ipynb": "../11_scientific/kaplan_meier/kaplan_meier.ipynb", "py": "../11_scientific/kaplan_meier/kaplan_meier.py", "html": null}, {"slug": "forest_plot", "title": "Forest Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "Shows effect estimates (hazard ratio, odds ratio, mean difference) with confidence intervals for many subgroups or studies, aligned against a line of no effect. It is the core figure of meta-analyses and trial subgroup analyses.", "use": ["Show a meta-analysis that pools results from several studies", "Check the consistency of a treatment effect across pre-specified subgroups", "Present regression coefficients or odds ratios with their CIs"], "avoid": ["There are only one or two estimates (state them in text)", "Estimates are on different scales (normalize first)"], "engine": "mpl", "real": false, "shapes": ["uncertainty", "categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/forest_plot.png", "ipynb": "../11_scientific/forest_plot/forest_plot.ipynb", "py": "../11_scientific/forest_plot/forest_plot.py", "html": null}, {"slug": "volcano_plot", "title": "Volcano Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "A scatter of effect size (log2 fold change) against statistical significance (−log10 p) for thousands of features at once. Hits that are both large and significant rise to the upper corners.", "use": ["Show differential gene or protein expression (RNA-seq, proteomics, metabolomics)", "Show any mass univariate test where both effect size and p-value matter"], "avoid": ["There are only a few features (use a forest plot or table)", "There are no p-values (use an MA plot or rank plot)"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/volcano_plot.png", "ipynb": "../11_scientific/volcano_plot/volcano_plot.ipynb", "py": "../11_scientific/volcano_plot/volcano_plot.py", "html": null}, {"slug": "manhattan_plot", "title": "Manhattan Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "Plots −log10 p for every genetic variant against its genomic position, chromosome by chromosome. Association signals stand out as 'skyscrapers' above a genome-wide significance line.", "use": ["Show genome-wide association studies (GWAS) or epigenome-wide scans", "Show any long, ordered sequence of tests where the location of strong signals matters"], "avoid": ["There are few tests (use a volcano or forest plot)", "Position along the x-axis has no meaning"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/manhattan_plot.png", "ipynb": "../11_scientific/manhattan_plot/manhattan_plot.ipynb", "py": "../11_scientific/manhattan_plot/manhattan_plot.py", "html": null}, {"slug": "swimmer_plot", "title": "Swimmer Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "One horizontal bar per patient shows time on treatment, with markers for key events (response onset, progression, ongoing therapy). It tells each patient's story, which summary curves hide.", "use": ["Show individual treatment duration and response in early-phase oncology trials", "Show durability of response alongside time to response", "Show any per-entity timeline with events (customer lifecycles, equipment maintenance)"], "avoid": ["There are more than about 50 patients (bars become unreadable; use Kaplan–Meier curves)", "Only aggregate statistics matter"], "engine": "mpl", "real": false, "shapes": ["events", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/swimmer_plot.png", "ipynb": "../11_scientific/swimmer_plot/swimmer_plot.ipynb", "py": "../11_scientific/swimmer_plot/swimmer_plot.py", "html": null}, {"slug": "tumor_response_waterfall", "title": "Tumour Response Waterfall Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "One vertical bar per patient shows the best percentage change in tumour size from baseline, sorted from worst to best. Response categories (RECIST) can be read straight off the threshold lines.", "use": ["Show tumour shrinkage in single-arm or early-phase oncology trials", "Show any per-subject percent change where thresholds define categories"], "avoid": ["Time course or durability matters (pair it with a swimmer or spider plot)", "Comparing arms of very different sizes in one panel (use one panel per arm)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/tumor_response_waterfall.png", "ipynb": "../11_scientific/tumor_response_waterfall/tumor_response_waterfall.ipynb", "py": "../11_scientific/tumor_response_waterfall/tumor_response_waterfall.py", "html": null}, {"slug": "bland_altman", "title": "Bland–Altman Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "Plots the difference between two measurement methods against their mean, with lines for the mean bias and the 95% limits of agreement. It answers whether two methods agree well enough to be interchangeable, which a correlation coefficient cannot.", "use": ["Compare a new measurement device or assay with a reference standard", "Assess inter-rater or test–retest agreement on a continuous scale", "Detect proportional bias, where the difference grows with magnitude"], "avoid": ["Measurements are categorical (use Cohen's kappa or a confusion matrix)", "The goal is prediction rather than agreement (use a scatter plot with regression)"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/bland_altman.png", "ipynb": "../11_scientific/bland_altman/bland_altman.ipynb", "py": "../11_scientific/bland_altman/bland_altman.py", "html": null}, {"slug": "clustered_heatmap", "title": "Clustered Heatmap (with dendrograms)", "family": "11_scientific", "familyName": "Scientific", "purpose": "A matrix heatmap whose rows and columns are reordered by hierarchical clustering, with dendrograms on the margins. Blocks of similar features and similar samples emerge without any prior grouping.", "use": ["Show gene expression signatures across samples", "Group customers, products or sensors by similarity profiles", "Show a correlation matrix where variable order should reveal clusters"], "avoid": ["There are more than about 200 rows (summarise first or filter to the top-variance features)", "Rows must keep a meaningful fixed order (time, rank)"], "engine": "mpl", "real": true, "shapes": ["numeric", "hierarchy"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/clustered_heatmap.png", "ipynb": "../11_scientific/clustered_heatmap/clustered_heatmap.ipynb", "py": "../11_scientific/clustered_heatmap/clustered_heatmap.py", "html": null}, {"slug": "error_bar_ci", "title": "Means with 95% Confidence Intervals", "family": "11_scientific", "familyName": "Scientific", "purpose": "Plots each group's mean as a dot with a 95% confidence interval, over the raw observations. Readers see the estimate, its uncertainty, and the data behind it, which a bar-of-means ('dynamite plot') hides.", "use": ["Compare group means from experiments or trials (dose groups, conditions)", "Show estimates together with their uncertainty", "Replace 'dynamite plots' (bars with error whiskers)"], "avoid": ["Distributions are strongly skewed or multimodal (show box, violin or raincloud plots)", "The audience may confuse SD, SE and CI (always say which one in the axis label or caption)"], "engine": "mpl", "real": false, "shapes": ["uncertainty", "categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/error_bar_ci.png", "ipynb": "../11_scientific/error_bar_ci/error_bar_ci.ipynb", "py": "../11_scientific/error_bar_ci/error_bar_ci.py", "html": null}, {"slug": "upset_plot", "title": "UpSet Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "Shows how several sets overlap. A matrix of dots marks which sets make up each intersection, and a bar above each column gives its size. It scales to many sets where Venn and Euler diagrams become unreadable.", "use": ["Show the overlap of more than three sets (comorbidities, gene lists, mutation co-occurrence, survey multi-select answers)", "Rank intersections by size to find the most common combinations", "Compare exact intersection counts rather than reading shapes"], "avoid": ["There are only two or three sets and the audience expects a Venn diagram", "The number of non-empty intersections is huge (keep the top 15–25 and say so)"], "engine": "mpl", "real": false, "shapes": ["sets"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/upset_plot.png", "ipynb": "../11_scientific/upset_plot/upset_plot.ipynb", "py": "../11_scientific/upset_plot/upset_plot.py", "html": null}, {"slug": "cumulative_incidence", "title": "Cumulative Incidence (Competing Risks)", "family": "11_scientific", "familyName": "Scientific", "purpose": "Plots the probability that a specific event has happened by time t when other events can prevent it, for example relapse when patients can also die without relapsing. The Aalen–Johansen estimator splits cumulative risk correctly between the competing causes.", "use": ["Show time-to-event outcomes where a competing event removes patients from risk (death before relapse, transplant before death)", "Report the actual absolute risk of a specific event for prognosis or counselling", "Compare cause-specific risks between groups (pair with Gray's test or Fine–Gray regression)"], "avoid": ["There is only one possible event type and censoring is independent (Kaplan–Meier is fine)", "The question is about biological effect rather than absolute risk (cause-specific hazards may suit better)"], "engine": "mpl", "real": false, "shapes": ["events"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/cumulative_incidence.png", "ipynb": "../11_scientific/cumulative_incidence/cumulative_incidence.ipynb", "py": "../11_scientific/cumulative_incidence/cumulative_incidence.py", "html": null}, {"slug": "decision_curve", "title": "Decision Curve Analysis", "family": "11_scientific", "familyName": "Scientific", "purpose": "Plots the net benefit of using a prediction model to decide on treatment, across the range of threshold probabilities at which a clinician or patient would act. Each model is compared against the default strategies \"treat everyone\" and \"treat no one\", so the plot shows whether a model is clinically useful and not just accurate.", "use": ["Judge whether a risk model or biomarker would improve decisions (biopsy, adjuvant therapy, screening)", "Compare models with similar AUC that may differ in clinical usefulness", "Show the range of risk thresholds over which a model is worth using"], "avoid": ["The model will not be used to make a yes/no decision", "The predicted probabilities are badly miscalibrated (fix calibration first; net benefit depends on it)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/decision_curve.png", "ipynb": "../11_scientific/decision_curve/decision_curve.ipynb", "py": "../11_scientific/decision_curve/decision_curve.py", "html": null}, {"slug": "nomogram", "title": "Nomogram", "family": "11_scientific", "familyName": "Scientific", "purpose": "A graphical calculator for a regression model. Each predictor has its own scale; you read off points for a patient's values, add them up, and convert the total to a predicted probability on the bottom scale. It makes a model usable at the bedside without software.", "use": ["Turn a logistic or Cox model into a tool clinicians can use by hand", "Show the relative weight each predictor carries in the model (length of each scale)", "Publish a prognostic model alongside its coefficients"], "avoid": ["The model has many interactions or non-linear terms that make the scales confusing", "An online calculator or EHR integration is available (it is less error-prone)", "The model is not validated (a nomogram makes an unvalidated model look authoritative)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/nomogram.png", "ipynb": "../11_scientific/nomogram/nomogram.ipynb", "py": "../11_scientific/nomogram/nomogram.py", "html": null}, {"slug": "oncoprint", "title": "OncoPrint (Mutation Matrix)", "family": "11_scientific", "familyName": "Scientific", "purpose": "A genes × samples grid in which each cell's glyph shows the type of alteration (mutation, amplification, deletion) a tumour carries in that gene. Samples are sorted so patterns of co-occurrence and mutual exclusivity stand out, and marginal bars give alteration frequencies.", "use": ["Summarise the genomic landscape of a tumour cohort for a set of driver genes", "Show mutual exclusivity or co-occurrence of alterations across patients", "Show the alteration type and the alteration frequency in one figure"], "avoid": ["There are hundreds of genes (filter to recurrently altered or pathway genes)", "There are thousands of samples, so glyphs shrink below a pixel (aggregate or use frequency bars alone)"], "engine": "mpl", "real": false, "shapes": ["categories", "sets"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/oncoprint.png", "ipynb": "../11_scientific/oncoprint/oncoprint.ipynb", "py": "../11_scientific/oncoprint/oncoprint.py", "html": null}, {"slug": "mutation_lollipop", "title": "Mutation Lollipop Plot", "family": "11_scientific", "familyName": "Scientific", "purpose": "Draws a protein as a horizontal bar with its functional domains, and places a lollipop at each mutated amino acid position. Stem height is the number of patients with that mutation and head color is the mutation type, so hotspots and their location relative to domains are visible at once.", "use": ["Show where mutations fall along one gene or protein in a cohort", "Identify hotspots and whether they cluster in a functional domain", "Contrast hotspot mutations (oncogene pattern) with scattered truncating mutations (tumour-suppressor pattern)"], "avoid": ["Comparing many genes (use an oncoprint or frequency bars)", "Mutations are too dense to separate at the plotted resolution (bin positions or zoom into a domain)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/mutation_lollipop.png", "ipynb": "../11_scientific/mutation_lollipop/mutation_lollipop.ipynb", "py": "../11_scientific/mutation_lollipop/mutation_lollipop.py", "html": null}, {"slug": "spaghetti_longitudinal", "title": "Spaghetti Plot (Longitudinal Trajectories)", "family": "11_scientific", "familyName": "Scientific", "purpose": "Draws one thin line per subject for repeated measurements over time, with the group mean and its confidence band on top. Individual variation, dropout and the average trend are visible together, which a plot of means alone hides.", "use": ["Show repeated lab values, vital signs or scores per patient over follow-up visits", "Show between-patient heterogeneity around an average trajectory", "Spot unusual individual trajectories, dropout and irregular visit timing"], "avoid": ["There are hundreds of subjects so the lines become a solid mass (sample them, use a density band, or facet by group)", "Only group averages matter and individual data cannot be shown (for privacy reasons)"], "engine": "mpl", "real": false, "shapes": ["time", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/spaghetti_longitudinal.png", "ipynb": "../11_scientific/spaghetti_longitudinal/spaghetti_longitudinal.ipynb", "py": "../11_scientific/spaghetti_longitudinal/spaghetti_longitudinal.py", "html": null}, {"slug": "consort_diagram", "title": "CONSORT Flow Diagram", "family": "11_scientific", "familyName": "Scientific", "purpose": "A standardised flowchart showing how participants moved through a randomised trial, from assessment for eligibility through allocation and follow-up to analysis, with the number excluded and the reason at each step. Readers use it to judge selection bias and attrition.", "use": ["Report any randomised controlled trial (required by the CONSORT statement and most journals)", "Show participant flow in cohort studies or screening programmes (STROBE/STARD-style flow)", "Make attrition and exclusions transparent"], "avoid": ["The process is not a sequential flow of participants (use a Sankey diagram for many-to-many flows)"], "engine": "mpl", "real": false, "shapes": ["flows"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/consort_diagram.png", "ipynb": "../11_scientific/consort_diagram/consort_diagram.ipynb", "py": "../11_scientific/consort_diagram/consort_diagram.py", "html": null}, {"slug": "roc_curve", "title": "ROC Curve", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Plots a classifier's true-positive rate against its false-positive rate at every decision threshold. The area under the curve (AUC) summarises discrimination independently of the threshold.", "use": ["Compare the discriminative ability of diagnostic tests or ML classifiers", "Choose an operating threshold that trades sensitivity against specificity", "Use when classes are reasonably balanced"], "avoid": ["Positives are rare (ROC looks optimistic; use a precision–recall curve)", "You care about calibrated probabilities rather than ranking (use a calibration plot)"], "engine": "mpl", "real": true, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/roc_curve.png", "ipynb": "../12_machine_learning/roc_curve/roc_curve.ipynb", "py": "../12_machine_learning/roc_curve/roc_curve.py", "html": null}, {"slug": "precision_recall_curve", "title": "Precision–Recall Curve", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Plots precision (positive predictive value) against recall (sensitivity) across thresholds. Unlike ROC, it focuses on the positive class, so it stays honest when positives are rare.", "use": ["Evaluate classifiers on imbalanced data (rare disease screening, fraud, defects)", "Show the cost of false positives when chasing more recall"], "avoid": ["Classes are balanced and both matter equally (ROC is more familiar)", "Comparing PR curves across datasets with different prevalence (the baselines differ)"], "engine": "mpl", "real": true, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/precision_recall_curve.png", "ipynb": "../12_machine_learning/precision_recall_curve/precision_recall_curve.ipynb", "py": "../12_machine_learning/precision_recall_curve/precision_recall_curve.py", "html": null}, {"slug": "calibration_plot", "title": "Calibration (Reliability) Plot", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Compares predicted probabilities with observed event frequencies, bin by bin. It shows whether a model's '30% risk' really means that 30 of 100 such patients have the event.", "use": ["Evaluate clinical risk scores and any model whose probabilities drive decisions", "Check models after recalibration (Platt or isotonic scaling)", "Use alongside ROC/AUC, because a model can rank well and still be badly calibrated"], "avoid": ["Only the ranking matters, not the probabilities", "The sample is so small that each bin holds only a few cases (use fewer bins or a smoothed curve)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/calibration_plot.png", "ipynb": "../12_machine_learning/calibration_plot/calibration_plot.ipynb", "py": "../12_machine_learning/calibration_plot/calibration_plot.py", "html": null}, {"slug": "confusion_matrix", "title": "Confusion Matrix", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "A grid of actual versus predicted classes. The diagonal holds correct predictions, and every off-diagonal cell shows a specific kind of mistake.", "use": ["Show which classes a classifier confuses with each other", "Report sensitivity and specificity per class for a diagnostic test", "Show agreement between two raters or two methods on categorical labels"], "avoid": ["There are dozens of classes (aggregate, or show only the top confusions)", "You need threshold-free performance (use ROC or PR curves)"], "engine": "mpl", "real": true, "shapes": ["model", "categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/confusion_matrix.png", "ipynb": "../12_machine_learning/confusion_matrix/confusion_matrix.ipynb", "py": "../12_machine_learning/confusion_matrix/confusion_matrix.py", "html": null}, {"slug": "learning_curve", "title": "Learning Curve", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Plots training and cross-validated performance against the number of training examples. The gap and the trend tell you whether a model is underfitting, overfitting, or would benefit from more data.", "use": ["Decide whether collecting more data is likely to improve a model", "Diagnose overfitting (large train–validation gap) or underfitting (both scores low)", "Compare how quickly candidate models learn from limited data"], "avoid": ["The dataset is tiny (cross-validation scores will be too noisy to compare)", "You want to compare models at one fixed data size (a table or dot plot is clearer)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/learning_curve.png", "ipynb": "../12_machine_learning/learning_curve/learning_curve.ipynb", "py": "../12_machine_learning/learning_curve/learning_curve.py", "html": null}, {"slug": "residual_diagnostics", "title": "Regression Residual Diagnostics", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "A 2×2 panel of standard checks for a linear regression: residuals vs fitted (non-linearity), normal Q-Q (normality), scale-location (constant variance) and residuals vs leverage (influential points). It shows whether the model's assumptions hold before you trust its coefficients and p-values.", "use": ["Validate any linear or generalized linear model before reporting it", "Find influential observations that drive the fit", "Decide whether to transform the outcome or add non-linear terms"], "avoid": ["The audience only needs the model's conclusions (keep this in the appendix)", "The model is not regression-based (use calibration or residual plots specific to that model)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/residual_diagnostics.png", "ipynb": "../12_machine_learning/residual_diagnostics/residual_diagnostics.ipynb", "py": "../12_machine_learning/residual_diagnostics/residual_diagnostics.py", "html": null}, {"slug": "permutation_importance", "title": "Permutation Feature Importance", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Ranks features by how much a model's held-out performance drops when that feature's values are randomly shuffled. Box plots over many shuffles show both the importance and its uncertainty.", "use": ["Rank the features any fitted model relies on (model-agnostic)", "Compare importance on held-out data rather than training data", "Show that some \"important-looking\" features are indistinguishable from zero"], "avoid": ["Features are strongly correlated (shuffling one leaves its twin, so both look unimportant)", "You need the direction of an effect (use SHAP or partial dependence)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/permutation_importance.png", "ipynb": "../12_machine_learning/permutation_importance/permutation_importance.ipynb", "py": "../12_machine_learning/permutation_importance/permutation_importance.py", "html": null}, {"slug": "shap_summary", "title": "SHAP Summary (Beeswarm)", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "One row per feature, one dot per prediction. A dot's horizontal position is how much that feature pushed that prediction up or down, and its color is the feature's value. The chart shows which features matter, in which direction, and for whom.", "use": ["Explain a predictive model globally while keeping per-patient detail", "Show whether high values of a feature raise or lower the prediction", "Spot features whose effect is large for a few cases but small on average"], "avoid": ["Readers will take contributions as causal effects (they explain the model, not the world)", "Features are strongly correlated (attributions get split arbitrarily between them)", "You need a single explanation for one patient (use a waterfall/force plot)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/shap_summary.png", "ipynb": "../12_machine_learning/shap_summary/shap_summary.ipynb", "py": "../12_machine_learning/shap_summary/shap_summary.py", "html": null}, {"slug": "shap_dependence", "title": "SHAP Dependence Plot", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "One dot per prediction. The x-axis is a feature's value and the y-axis is how much that value pushed the prediction up or down (its SHAP contribution). Color is a second feature. The shape of the cloud shows the effect, and a color split that fans out shows an interaction: the effect of one feature depends on another.", "use": ["Show the shape of one feature's effect in a model (linear, threshold, saturating)", "Detect and explain interactions, e.g. utilization hurts more when income is low", "Follow up on a SHAP summary plot for the top features"], "avoid": ["Readers will interpret contributions as causal effects (they describe the model, not the world)", "Features are strongly correlated (attributions get split arbitrarily between them)", "Only the overall importance ranking is needed (use permutation importance or a SHAP summary)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/shap_dependence.png", "ipynb": "../12_machine_learning/shap_dependence/shap_dependence.ipynb", "py": "../12_machine_learning/shap_dependence/shap_dependence.py", "html": null}, {"slug": "partial_dependence", "title": "Partial Dependence & ICE Plot", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "Shows how a model's prediction changes as one feature varies while the others stay at their observed values. Thin ICE lines trace individual cases and the bold line is their average (partial dependence), which exposes the shape of a feature's effect: linear, threshold, plateau or interaction.", "use": ["Explain the shape of a feature's effect in a black-box model (gradient boosting, random forest)", "Check for thresholds or saturation that a linear model would miss", "Spot interactions (ICE lines that are not parallel)"], "avoid": ["The feature is strongly correlated with others (the model gets evaluated on impossible combinations)", "You need effects for more than ~2 features at once"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/partial_dependence.png", "ipynb": "../12_machine_learning/partial_dependence/partial_dependence.ipynb", "py": "../12_machine_learning/partial_dependence/partial_dependence.py", "html": null}, {"slug": "pdp_2d", "title": "2-D Partial Dependence Plot", "family": "12_machine_learning", "familyName": "Machine learning", "purpose": "A heatmap of a model's average prediction over a grid of two features, holding everything else at its observed values, with each feature's 1-D partial dependence along the margins. If the two effects simply add up, every row of the heatmap is the same left-to-right pattern shifted up or down. When the pattern changes shape from row to row, the features interact.", "use": ["See how two features jointly drive a model's prediction", "Check whether an interaction the model may have learned is real and large", "Explain a nonlinear model (gradient boosting, random forest) to a technical audience"], "avoid": ["The two features are strongly correlated (the grid includes combinations that never occur)", "You need per-observation explanations (use ICE or SHAP dependence plots)", "The audience is non-technical (a 1-D effect plot is easier)"], "engine": "mpl", "real": false, "shapes": ["model"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/pdp_2d.png", "ipynb": "../12_machine_learning/pdp_2d/pdp_2d.ipynb", "py": "../12_machine_learning/pdp_2d/pdp_2d.py", "html": null}, {"slug": "gradient_interval", "title": "Gradient Interval", "family": "13_uncertainty", "familyName": "Uncertainty", "purpose": "Draws each estimate's uncertainty as a band whose opacity follows the probability density: darkest at the most likely value, fading out towards the tails. Unlike a hard-edged error bar, it does not suggest that values just inside the interval are plausible and values just outside are impossible.", "use": ["Present forecasts or estimates to a general audience, where error bars get misread as hard limits", "Compare several uncertain estimates on one scale", "Show that intervals overlap without implying a bright-line cutoff"], "avoid": ["The audience needs exact interval endpoints (add numbers or use a forest plot)", "The distribution is multimodal (the gradient hides the bumps; use a density or half-eye)"], "engine": "mpl", "real": false, "shapes": ["uncertainty"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/gradient_interval.png", "ipynb": "../13_uncertainty/gradient_interval/gradient_interval.ipynb", "py": "../13_uncertainty/gradient_interval/gradient_interval.py", "html": null}, {"slug": "quantile_dotplot", "title": "Quantile Dotplot", "family": "13_uncertainty", "familyName": "Uncertainty", "purpose": "Turns a probability distribution into a small number of dots (here 20), each holding an equal share of probability (5%), stacked like a histogram. Readers can count dots to answer \"what are my chances?\" without reading a density curve. Kay et al. (2016) showed people make better decisions with it than with densities or intervals.", "use": ["Communicate a predictive distribution to the public (arrival times, waiting times, forecasts)", "Support a threshold decision (\"how likely is it before 10 minutes?\")", "Show risk as frequencies, which most people find easier than percentages"], "avoid": ["You need fine detail in the tails (20–50 dots cannot show rare events)", "Comparing many distributions at once (use half-eye or gradient intervals)"], "engine": "mpl", "real": false, "shapes": ["uncertainty"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/quantile_dotplot.png", "ipynb": "../13_uncertainty/quantile_dotplot/quantile_dotplot.ipynb", "py": "../13_uncertainty/quantile_dotplot/quantile_dotplot.py", "html": null}, {"slug": "hypothetical_outcomes", "title": "Hypothetical Outcome Plot (HOP)", "family": "13_uncertainty", "familyName": "Uncertainty", "purpose": "Animates uncertainty instead of summarizing it. Each frame shows one plausible outcome drawn from the distribution, so viewers experience how often one option beats another rather than reading overlapping error bars. Hullman et al. (2015) found HOPs improve judgements of the probability that A > B.", "use": ["Answer \"how often is A better than B?\" when the uncertainty intervals overlap", "Communicate model uncertainty to non-experts in an interactive or presentation setting", "Show that a \"winner\" by average is not a guaranteed winner"], "avoid": ["The output is printed or static (it needs animation; use gradient intervals or half-eye instead)", "Readers need precise interval values", "The animation would run too fast to follow (under ~300 ms per frame)"], "engine": "plotly", "real": false, "shapes": ["uncertainty"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/hypothetical_outcomes.png", "ipynb": "../13_uncertainty/hypothetical_outcomes/hypothetical_outcomes.ipynb", "py": "../13_uncertainty/hypothetical_outcomes/hypothetical_outcomes.py", "html": "../13_uncertainty/hypothetical_outcomes/hypothetical_outcomes.html"}, {"slug": "icon_array", "title": "Icon Array (Risk Communication)", "family": "13_uncertainty", "familyName": "Uncertainty", "purpose": "Shows a probability as a grid of 100 people, colouring those affected. Natural frequencies (\"7 in 100\") shown as countable figures are understood far better than percentages or relative risks, especially by people with low numeracy. Icon arrays are a recommended format in patient decision aids.", "use": ["Communicate a risk or benefit to patients or the public", "Compare absolute risks between options (treatment vs no treatment)", "Counter the inflation produced by relative risk (\"doubles the risk\" from 1 to 2 in 100)"], "avoid": ["The risk is very small (under 1 in 1,000 needs 1,000 icons; use a different denominator or text)", "The audience is technical and needs intervals or many comparisons"], "engine": "mpl", "real": false, "shapes": ["uncertainty", "categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/icon_array.png", "ipynb": "../13_uncertainty/icon_array/icon_array.ipynb", "py": "../13_uncertainty/icon_array/icon_array.py", "html": null}, {"slug": "half_eye", "title": "Half-Eye Plot (Density + Intervals)", "family": "13_uncertainty", "familyName": "Uncertainty", "purpose": "Combines a half-violin density (the shape of the uncertainty) with a point estimate and two nested intervals beneath it: a thick 66% interval and a thin 95% interval. It shows the full distribution and conventional summaries in one compact mark, and is common for Bayesian posteriors and bootstrap distributions.", "use": ["Show posterior or bootstrap distributions for several groups or parameters", "Distributions may be skewed, and a symmetric error bar would misrepresent them", "Combine intuitive shape with precise interval endpoints"], "avoid": ["The audience is unfamiliar with intervals and densities (use an icon array or quantile dotplot)", "You have raw observations rather than uncertainty about an estimate (use a raincloud plot)"], "engine": "mpl", "real": false, "shapes": ["uncertainty"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/half_eye.png", "ipynb": "../13_uncertainty/half_eye/half_eye.ipynb", "py": "../13_uncertainty/half_eye/half_eye.py", "html": null}, {"slug": "dual_axis_vs_indexed", "title": "Dual Axis vs. Indexed Line", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "A dual-axis chart plots two measures with different units against two independent y-scales. Because the designer picks both scales, where the lines cross, how steep they look, and whether they seem to move together are all arbitrary. The chart can invent a correlation, or hide one.", "use": ["Use an indexed line chart (each series = 100 at a common start) to compare the growth of measures with different units", "Use two stacked charts with a shared x-axis when the absolute levels matter"], "avoid": ["Two measures with different units or scales that you want to show \"together\"", "Revenue vs. users, price vs. volume, cases vs. tests"], "engine": "mpl", "real": false, "shapes": ["time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/dual_axis_vs_indexed.png", "ipynb": "../14_bad_vs_good/dual_axis_vs_indexed/dual_axis_vs_indexed.ipynb", "py": "../14_bad_vs_good/dual_axis_vs_indexed/dual_axis_vs_indexed.py", "html": null}, {"slug": "truncated_bar_axis", "title": "Truncated Bar Axis vs. Zero Baseline", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Bars encode value by length, so a bar chart whose y-axis starts above zero makes small differences look large. In the example a 5-point gap looks like a 6-fold one. Readers judge the bar lengths, not the tick labels.", "use": ["Always start bar and column charts at zero", "If the small differences are the story, switch to a dot plot, which may use a zoomed axis because it encodes position, not length"], "avoid": ["Bar charts of values clustered far from zero (satisfaction scores, percentages near 100)", "Dashboard defaults that auto-scale the y-axis to the data range"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/truncated_bar_axis.png", "ipynb": "../14_bad_vs_good/truncated_bar_axis/truncated_bar_axis.ipynb", "py": "../14_bad_vs_good/truncated_bar_axis/truncated_bar_axis.py", "html": null}, {"slug": "pie_close_values", "title": "Pie of Close Values vs. Sorted Bar", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "People judge angles and areas much less accurately than lengths on a common baseline. In a pie of near-equal slices you cannot rank them or see the differences, and the many colors force the reader to keep looking back at the legend.", "use": ["Use a sorted bar chart when the reader must compare or rank shares", "Keep pies for a single dominant share or simple 2–3 part splits seen at a glance"], "avoid": ["More than ~5 slices, or slices of similar size", "Comparing the same breakdown across several pies", "3-D or exploded pies, which distort angles further"], "engine": "mpl", "real": false, "shapes": ["categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/pie_close_values.png", "ipynb": "../14_bad_vs_good/pie_close_values/pie_close_values.ipynb", "py": "../14_bad_vs_good/pie_close_values/pie_close_values.py", "html": null}, {"slug": "rainbow_colormap", "title": "Rainbow Colormap vs. One-Hue Sequential", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Rainbow colormaps such as jet do not change lightness evenly. They brighten to yellow and cyan and darken at blue and red, so the eye sees sharp \"bands\" and boundaries that are not in the data, while real gradients get flattened. They also have no intuitive low-to-high order and fail for color-blind readers and in grayscale print.", "use": ["Use a one-hue sequential map (light = low, dark = high) for continuous magnitude", "Use a two-hue diverging map with a neutral midpoint when the data has a meaningful center"], "avoid": ["Default \"jet\", \"rainbow\", \"hsv\" or \"spectral\" maps on heatmaps, surfaces and choropleths", "Any map where lightness does not increase monotonically"], "engine": "mpl", "real": false, "shapes": ["numeric", "geo"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/rainbow_colormap.png", "ipynb": "../14_bad_vs_good/rainbow_colormap/rainbow_colormap.ipynb", "py": "../14_bad_vs_good/rainbow_colormap/rainbow_colormap.py", "html": null}, {"slug": "spaghetti_vs_highlight", "title": "Spaghetti Chart vs. Highlight", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Plotting a dozen or more colored lines together produces a \"spaghetti\" tangle. Colors run out and repeat, the legend becomes a lookup puzzle, and no single story stands out. The reader cannot follow any one line.", "use": ["Highlight the one or two series that carry the message and gray the rest as context", "Use small multiples when every series matters equally"], "avoid": ["More than ~4–5 series on one line chart, each with its own color", "Default color cycles that repeat hues after 8–10 series"], "engine": "mpl", "real": false, "shapes": ["time", "categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/spaghetti_vs_highlight.png", "ipynb": "../14_bad_vs_good/spaghetti_vs_highlight/spaghetti_vs_highlight.ipynb", "py": "../14_bad_vs_good/spaghetti_vs_highlight/spaghetti_vs_highlight.py", "html": null}, {"slug": "unsorted_bars", "title": "Unsorted Rainbow Bars vs. Sorted Bars", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Bars in alphabetical (or random) order, each in a different color, make the reader do the sorting in their head. The colors carry no information but suggest that they do, and vertical bars with long names force rotated, hard-to-read labels.", "use": ["Sort nominal categories by value so ranking is immediate", "Use horizontal bars when category names are long", "Use one color for one series; add a second color only to highlight"], "avoid": ["Alphabetical ordering of categories that have no natural order", "Coloring each bar differently \"to look nice\"", "Rotated 45°/90° x-axis labels"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/unsorted_bars.png", "ipynb": "../14_bad_vs_good/unsorted_bars/unsorted_bars.ipynb", "py": "../14_bad_vs_good/unsorted_bars/unsorted_bars.py", "html": null}, {"slug": "overplotting", "title": "Overplotting vs. Density Binning", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "With tens of thousands of points, opaque markers pile on top of each other until the plot becomes a solid blob. Dense regions and sparse regions look the same, so the chart hides where the data actually is. Hidden clusters, gaps and the true shape of the relationship disappear.", "use": ["Use a hexbin or 2-D histogram (with a log color scale) for more than ~5,000 points", "Use small, transparent markers for a few thousand points", "Use 2-D density contours to show the shape of the distribution"], "avoid": ["Default scatter plots of large datasets (logs, sensors, EHR extracts, genomics)", "Large opaque markers drawn in data order (the last group drawn hides the others)"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/overplotting.png", "ipynb": "../14_bad_vs_good/overplotting/overplotting.ipynb", "py": "../14_bad_vs_good/overplotting/overplotting.py", "html": null}, {"slug": "dynamite_plot", "title": "Dynamite Plot vs. Points + Confidence Interval", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "A \"dynamite plot\" (bar of the mean plus a standard-error whisker) shows only two numbers per group and hides the data. Groups with the same mean but completely different distributions (bimodal, skewed, with outliers, tiny n) look identical. The bar also suggests that values fill the area from zero up to the mean, which they do not, and SE whiskers are routinely misread as data spread or as confidence intervals.", "use": ["Show the raw data points (jittered or beeswarm) with the mean and 95% CI on top for small-to-moderate n", "Use box, violin or raincloud plots for larger samples", "State the interval type and n in the chart"], "avoid": ["Bar charts of means for continuous measurements, common in lab and clinical papers", "Error bars without saying whether they are SD, SE or CI"], "engine": "mpl", "real": false, "shapes": ["numeric", "categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/dynamite_plot.png", "ipynb": "../14_bad_vs_good/dynamite_plot/dynamite_plot.ipynb", "py": "../14_bad_vs_good/dynamite_plot/dynamite_plot.py", "html": null}, {"slug": "bubble_radius_scaling", "title": "Bubble Scaled by Radius vs. by Area", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Readers judge a circle by its area. If the radius (or diameter) is made proportional to the value, the area grows with the square of the value, so a value twice as large looks four times as large and an 8× difference looks like a 64× difference.", "use": ["Scale bubble AREA proportional to value (radius ∝ √value) in bubble charts, bubble maps and packed circles", "Use bars instead when precise comparison matters, since people underestimate area differences even when area is scaled correctly"], "avoid": ["Hand-built bubble charts that set radius or diameter from the value", "Icons or pictograms scaled in both width and height by the value"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/bubble_radius_scaling.png", "ipynb": "../14_bad_vs_good/bubble_radius_scaling/bubble_radius_scaling.ipynb", "py": "../14_bad_vs_good/bubble_radius_scaling/bubble_radius_scaling.py", "html": null}, {"slug": "animation_vs_small_multiples", "title": "Animation vs. Small Multiples", "family": "14_bad_vs_good", "familyName": "Bad vs. good", "purpose": "Animation shows one moment at a time, so comparing frames depends on the reader's memory. Did East grow between March and October? In an animation you have to remember March's bar while watching October's. Research on animated transitions (e.g. Robertson et al., 2008) found animation engaging but worse for analysis than static small multiples.", "use": ["Use small multiples when readers must compare states over time or find the trend", "Use a single line chart when the trend of a few series is the message", "Keep animation for presentations and storytelling, alongside a static chart"], "avoid": ["Animating data the audience must analyse or compare", "Animation as the only view in a report, dashboard or PDF"], "engine": "mpl", "real": false, "shapes": ["time", "categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/animation_vs_small_multiples.png", "ipynb": "../14_bad_vs_good/animation_vs_small_multiples/animation_vs_small_multiples.ipynb", "py": "../14_bad_vs_good/animation_vs_small_multiples/animation_vs_small_multiples.py", "html": null}, {"slug": "option_payoff_explorer", "title": "Option Payoff Explorer (what-if sliders)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An interactive profit-and-loss chart for a single option. Sliders change the strike, implied volatility, days to expiry and option type, and the chart redraws two curves: the payoff at expiry (the hockey stick) and the Black-Scholes value today. Moving the sliders shows how time value and volatility bend the curve, which a static payoff diagram cannot show.", "use": ["Teach how strike, volatility and time to expiry change an option's value and risk", "Compare today's mark-to-market P&L with the P&L at expiry before entering a trade", "Explore \"what if implied volatility drops after earnings?\" scenarios interactively"], "avoid": ["A printed report or slide (sliders do nothing there; use the static option payoff small multiples)", "Multi-leg strategies with many strikes (the parameter space gets too large for sliders)", "Exact pricing of American options or with dividends (the model here is plain Black-Scholes)"], "engine": "altair", "real": false, "shapes": ["prices", "numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/option_payoff_explorer.png", "ipynb": "../15_interactive_advanced/option_payoff_explorer/option_payoff_explorer.ipynb", "py": "../15_interactive_advanced/option_payoff_explorer/option_payoff_explorer.py", "html": "../15_interactive_advanced/option_payoff_explorer/option_payoff_explorer.html"}, {"slug": "retirement_planner", "title": "Retirement Planner (Monte Carlo what-if)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An interactive Monte Carlo fan chart. Sliders set expected return, volatility and annual spending; the fan shows the range of portfolio values from 65 to 95, and a side panel shows the probability that the money lasts. Uncertainty is the message: readers see the spread of outcomes and how fast success falls as spending rises, instead of one optimistic projection.", "use": ["Financial planning conversations about a sustainable withdrawal rate", "Show how sensitive an outcome is to assumptions (return, volatility, spending)", "Replace a single straight-line projection with a range of plausible outcomes"], "avoid": ["The audience reads the median as a promise (label the fan and state the probability)", "Assumptions are unknown or contested (show a static scenario comparison instead)", "Precise tax or fee modelling is needed (this simulator ignores both)"], "engine": "altair", "real": false, "shapes": ["uncertainty", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/retirement_planner.png", "ipynb": "../15_interactive_advanced/retirement_planner/retirement_planner.ipynb", "py": "../15_interactive_advanced/retirement_planner/retirement_planner.py", "html": "../15_interactive_advanced/retirement_planner/retirement_planner.html"}, {"slug": "dcf_explorer", "title": "DCF Valuation Explorer (what-if sliders)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An interactive discounted-cash-flow model. Sliders change the discount rate (WACC), terminal growth and free-cash-flow margin; the chart recomputes the cash flows, their present values and the implied value per share against the current price. It shows how much of a valuation rests on assumptions, especially the terminal value.", "use": ["Show stakeholders which assumptions drive a valuation (usually WACC and terminal growth)", "Teach the mechanics of discounting and terminal value", "Pressure-test an investment case: how far must assumptions move before the upside disappears?"], "avoid": ["A formal valuation report (show a sensitivity table with the base case outlined)", "Businesses whose cash flows are negative or highly cyclical for years (a 5-year DCF misleads)", "Readers might treat the slider output as a price target"], "engine": "altair", "real": false, "shapes": ["numeric", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/dcf_explorer.png", "ipynb": "../15_interactive_advanced/dcf_explorer/dcf_explorer.ipynb", "py": "../15_interactive_advanced/dcf_explorer/dcf_explorer.py", "html": "../15_interactive_advanced/dcf_explorer/dcf_explorer.html"}, {"slug": "portfolio_builder", "title": "Portfolio Builder (weights → risk, return, drawdown)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "Sliders set the weights of four asset classes. The chart places the resulting portfolio on the risk/return plane against the efficient frontier and the individual assets, redraws its growth of $1, and reports return, volatility and maximum drawdown, all recomputed in the browser from the monthly return history. Readers learn diversification by doing it.", "use": ["Teach diversification and the efficient frontier interactively", "Let a client or committee explore allocations before a formal optimisation", "Show how adding a low-correlation asset (bonds, gold) changes risk and drawdown"], "avoid": ["A recommendation document (show the chosen allocation and its statistics statically)", "More than about five assets (sliders become unwieldy; use an optimiser and show results)", "Readers might take historical or simulated statistics as forecasts"], "engine": "altair", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/portfolio_builder.png", "ipynb": "../15_interactive_advanced/portfolio_builder/portfolio_builder.ipynb", "py": "../15_interactive_advanced/portfolio_builder/portfolio_builder.py", "html": "../15_interactive_advanced/portfolio_builder/portfolio_builder.html"}, {"slug": "linked_price_returns", "title": "Linked Price & Returns (brush to select a window)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "Two linked views of one price history. Dragging across the price chart selects a time window, and the histogram of daily returns and the summary statistics update to show only that window, against the full-period distribution in gray. The reader asks \"what was risk like during that episode?\" by pointing at it.", "use": ["Compare return distributions across calm and turbulent periods", "Explore a long price history before choosing the window for a formal analysis", "Show non-specialists that volatility changes over time"], "avoid": ["Static reports (pick the windows yourself and show small multiples)", "Very short histories, where a selected window has too few returns for a meaningful histogram"], "engine": "altair", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/linked_price_returns.png", "ipynb": "../15_interactive_advanced/linked_price_returns/linked_price_returns.ipynb", "py": "../15_interactive_advanced/linked_price_returns/linked_price_returns.py", "html": "../15_interactive_advanced/linked_price_returns/linked_price_returns.html"}, {"slug": "sector_click_filter", "title": "Sector Click-to-Filter (overview → detail)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An overview bar chart of sector returns linked to a detail scatter of individual stocks. Clicking a sector highlights its stocks on the risk/return plane and fades the rest, following Shneiderman's mantra: overview first, zoom and filter, details on demand. Readers go from \"which sector did well?\" to \"which stocks drove it, and at what risk?\" in one gesture.", "use": ["Drill down from an aggregate (sector, region, fund) to its members", "Compare one group's members against the whole universe without losing context", "Explore a screen or watchlist interactively"], "avoid": ["Readers who need every group at once (use small multiples)", "Fewer than about 20 members in total (one labelled scatter is enough)"], "engine": "altair", "real": false, "shapes": ["categories", "prices"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/sector_click_filter.png", "ipynb": "../15_interactive_advanced/sector_click_filter/sector_click_filter.ipynb", "py": "../15_interactive_advanced/sector_click_filter/sector_click_filter.py", "html": "../15_interactive_advanced/sector_click_filter/sector_click_filter.html"}, {"slug": "crossfilter_dashboard", "title": "Crossfilter Dashboard (every view filters the others)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "Three coordinated views of one sales table: by region, by product and by month. Clicking a region or product, or brushing a range of months, filters the other two views, while gray bars keep the unfiltered totals for context. A headline states the filtered total and its share. Many-dimensional questions get answered without writing a single group-by.", "use": ["Exploratory analysis of a cube (region × product × time) by business users", "Find which combination drives a change (\"is the Q4 jump all Phones in the West?\")", "Replace a stack of pivot tables with one interactive page"], "avoid": ["A one-message presentation (state the finding with one static chart)", "More than four or five dimensions (the page becomes a puzzle; use a BI tool)", "Readers on paper or static slides"], "engine": "altair", "real": false, "shapes": ["categories", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/crossfilter_dashboard.png", "ipynb": "../15_interactive_advanced/crossfilter_dashboard/crossfilter_dashboard.ipynb", "py": "../15_interactive_advanced/crossfilter_dashboard/crossfilter_dashboard.py", "html": "../15_interactive_advanced/crossfilter_dashboard/crossfilter_dashboard.html"}, {"slug": "bar_chart_race", "title": "Bar Chart Race (animated ranking)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An animated, re-sorting horizontal bar chart. Each frame shows the top N items at one moment, and bars overtake each other as time advances. Motion turns rank changes into a story: who rose, who fell, and when the leader changed.", "use": ["Tell a \"who led when\" story in a presentation or social post, where motion holds attention", "Show rank changes among many entities over a long period (market caps, brands, countries)", "Hook the audience before a detailed static analysis"], "avoid": ["Readers need to compare values precisely between two dates (use a slope or bump chart)", "The output is a printed report or PDF (a single frame loses the story)", "Ranks barely change (a static sorted bar is clearer)"], "engine": "mpl", "real": false, "shapes": ["time", "categories"], "alts": [], "level": "intermediate", "animated": true, "thumb": "thumbs/bar_chart_race.gif", "ipynb": "../15_interactive_advanced/bar_chart_race/bar_chart_race.ipynb", "py": "../15_interactive_advanced/bar_chart_race/bar_chart_race.py", "html": null}, {"slug": "animated_yield_curve", "title": "Animated Yield Curve (2000–2025)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "Plays the government bond yield curve through time, one frame per year, with a faint trail of the previous three years' curves. The curve's shape (upward sloping, flat or inverted) is the message, and watching it twist, shift and invert shows rate cycles more intuitively than any single snapshot.", "use": ["Explain rate cycles: easing, tightening, and curve inversions before recessions", "Teach how the short end follows the central bank while the long end follows growth and inflation expectations", "Present the history of a term structure (yields, futures, swap curves)"], "avoid": ["Readers need to compare two specific dates precisely (overlay those two curves statically)", "The medium is print (use the yield curve history heatmap instead)"], "engine": "plotly", "real": false, "shapes": ["time", "numeric"], "alts": [], "level": "intermediate", "animated": true, "thumb": "thumbs/animated_yield_curve.gif", "ipynb": "../15_interactive_advanced/animated_yield_curve/animated_yield_curve.ipynb", "py": "../15_interactive_advanced/animated_yield_curve/animated_yield_curve.py", "html": "../15_interactive_advanced/animated_yield_curve/animated_yield_curve.html"}, {"slug": "gapminder_bubbles", "title": "Animated Bubble Chart (Gapminder)", "family": "15_interactive_advanced", "familyName": "Interactive, animated & big data", "purpose": "An animated scatter of two measures, with bubble area for a third (population) and color for a group, stepping through time. Hans Rosling made it famous to show countries' wealth and health converging. Every country's path is visible at once, which a static chart cannot show without clutter.", "use": ["Show how many entities move through a two-measure space over time (wealth vs. health, risk vs. return)", "Tell a development or conve
