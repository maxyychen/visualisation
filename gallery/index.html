<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualization Gallery</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f5f2; --surface: #fcfcfb; --border: #e3e2de;
    --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
    --accent: #2a78d6; --accent-soft: #e4eefb; --chip: #ecebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
      --accent: #3987e5; --accent-soft: #1d2b3d; --chip: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e88;
    --accent: #3987e5; --accent-soft: #1d2b3d; --chip: #262624;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { max-width: 1280px; margin: 0 auto; padding: 32px 16px 8px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); margin: 0 0 20px; }
  .controls { position: sticky; top: 0; z-index: 2; background: var(--bg);
              max-width: 1280px; margin: 0 auto; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .search { width: 100%; padding: 10px 14px; font: inherit; color: var(--text); background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid transparent; background: var(--chip); color: var(--text-2); border-radius: 999px;
          padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .row { display: flex; gap: 10px; align-items: baseline; margin-top: 10px; }
  .row .chips { margin-top: 0; }
  .lbl { flex: 0 0 72px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  @media (max-width: 640px) { .row { flex-direction: column; gap: 4px; } .lbl { flex: none; } }
  .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .toggles { display: flex; gap: 14px; margin-top: 8px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
  .toggles label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px;
         display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
          display: flex; flex-direction: column; }
  .thumb { background: #fcfcfb; aspect-ratio: 7 / 5; display: flex; align-items: center; justify-content: center;
           border-bottom: 1px solid var(--border); }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .fam { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .title { font-weight: 600; font-size: 15px; }
  .badges { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: 1px; }
  .badge { font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px;
           background: var(--chip); color: var(--text-2); }
  .use { color: var(--text-2); font-size: 13.5px; }
  details { font-size: 13px; color: var(--text-2); }
  summary { cursor: pointer; color: var(--accent); }
  details ul { margin: 4px 0 6px; padding-left: 18px; }
  details h4 { margin: 8px 0 0; font-size: 12px; color: var(--text); }
  .links { margin-top: auto; display: flex; gap: 12px; font-size: 13px; padding-top: 6px; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .links button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .links button:hover { text-decoration: underline; }
  dialog { width: min(1100px, calc(100vw - 32px)); height: min(760px, calc(100vh - 32px)); padding: 0;
           border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px;
              border-bottom: 1px solid var(--border); font-weight: 600; }
  .dlg-head a, .dlg-head button { font: inherit; font-weight: 400; color: var(--accent); background: none; border: 0;
                                   cursor: pointer; text-decoration: none; margin-left: 14px; }
  dialog iframe { width: 100%; height: calc(100% - 46px); border: 0; background: #fcfcfb; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>Visualization Gallery</h1>
  <p class="sub" id="sub"></p>
</header>
<div class="controls">
  <input class="search" id="q" type="search" placeholder="Search charts, purposes, use cases…  (e.g. drawdown, share, outlier, yield)" aria-label="Search charts">
  <div class="row"><span class="lbl">Goal</span><div class="chips" id="chips" role="group" aria-label="Filter by family"></div></div>
  <div class="row"><span class="lbl">Level</span><div class="chips" id="levels" role="group" aria-label="Filter by level"></div></div>
  <div class="row"><span class="lbl">Your data</span><div class="chips" id="shapes" role="group" aria-label="Filter by the data you have"></div></div>
  <div class="toggles">
    <label><input type="checkbox" id="real"> Has a real-data variant</label>
    <label><input type="checkbox" id="alts"> Also shown in other libraries</label>
    <label><input type="checkbox" id="interactive"> Interactive</label>
    <label><input type="checkbox" id="animated"> Animated</label>
    <span class="count" id="count"></span>
  </div>
</div>
<main id="grid"></main>
<dialog id="dlg" aria-label="Interactive chart">
  <div class="dlg-head"><span id="dlg-title"></span>
    <span><a id="dlg-open" target="_blank" rel="noopener">Open in new tab</a><button id="dlg-close">Close</button></span></div>
  <iframe id="dlg-frame" title="Interactive chart"></iframe>
</dialog>
<script>
const CHARTS = [{"slug": "diverging_bar", "title": "Diverging Bar Chart", "family": "01_deviation", "familyName": "Deviation", "purpose": "A bar chart whose bars grow left or right (or up or down) from a shared reference line. Color shows direction, so the eye picks out above and below the baseline before reading magnitude.", "use": ["Show how far each category sits above or below a baseline (zero, target, average)", "Show signed values such as profit/loss, budget variance, or year-over-year change", "Rank items by deviation while keeping the sign visible"], "avoid": ["There is no meaningful reference point (use a plain bar chart)", "Values are all positive and the baseline is arbitrary", "There are more than ~30 categories (consider a dot plot or table)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/diverging_bar.png", "ipynb": "../01_deviation/diverging_bar/diverging_bar.ipynb", "py": "../01_deviation/diverging_bar/diverging_bar.py", "html": null}, {"slug": "diverging_stacked_bar", "title": "Diverging Stacked Bar (Likert)", "family": "01_deviation", "familyName": "Deviation", "purpose": "Stacks survey response levels so negative answers extend left and positive answers extend right from a central neutral line. Overall sentiment and its composition show together.", "use": ["Show Likert-scale survey results (disagree ↔ agree)", "Compare sentiment across many questions or groups at a glance", "Show ordered categorical responses that have a natural midpoint"], "avoid": ["Responses are not ordered or have no natural neutral point", "Readers need exact values for the inner segments (use a table)", "There are more than 5–7 response levels"], "engine": "mpl", "real": false, "shapes": ["categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/diverging_stacked_bar.png", "ipynb": "../01_deviation/diverging_stacked_bar/diverging_stacked_bar.ipynb", "py": "../01_deviation/diverging_stacked_bar/diverging_stacked_bar.py", "html": null}, {"slug": "surplus_deficit_line", "title": "Surplus / Deficit Filled Line", "family": "01_deviation", "familyName": "Deviation", "purpose": "A line chart filled toward a reference value, in one color above it and another below. It shows when a series runs in surplus or deficit and by how much.", "use": ["Show a time series that swings around a baseline (balance, temperature anomaly, net flow)", "Show the duration and size of positive and negative periods"], "avoid": ["Comparing several series (fills overlap and obscure each other)", "The baseline has no meaning"], "engine": "mpl", "real": false, "shapes": ["time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/surplus_deficit_line.png", "ipynb": "../01_deviation/surplus_deficit_line/surplus_deficit_line.ipynb", "py": "../01_deviation/surplus_deficit_line/surplus_deficit_line.py", "html": null}, {"slug": "deviation_lollipop", "title": "Deviation Lollipop (from mean)", "family": "01_deviation", "familyName": "Deviation", "purpose": "Each item is a dot joined by a thin stem to a reference value such as the group mean. It carries the same message as a diverging bar with much less ink, so it works well with many items.", "use": ["Show how far each item sits from the average or target", "Show many categories, where solid bars would look heavy", "Highlight outliers relative to a benchmark"], "avoid": ["Values are very close together (stems become invisible)", "The audience expects conventional bar charts"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/deviation_lollipop.png", "ipynb": "../01_deviation/deviation_lollipop/deviation_lollipop.ipynb", "py": "../01_deviation/deviation_lollipop/deviation_lollipop.py", "html": null}, {"slug": "diverging_column_time", "title": "Diverging Column (over time)", "family": "01_deviation", "familyName": "Deviation", "purpose": "Vertical bars rising from or falling below zero, one per time period. Each discrete period's positive or negative result stands on its own.", "use": ["Show discrete periods with signed results (monthly net cash flow, quarterly earnings surprise)", "Count the positive and negative periods"], "avoid": ["The data is continuous and dense (use a surplus/deficit line)", "There are more than ~60 periods"], "engine": "mpl", "real": false, "shapes": ["time", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/diverging_column_time.png", "ipynb": "../01_deviation/diverging_column_time/diverging_column_time.ipynb", "py": "../01_deviation/diverging_column_time/diverging_column_time.py", "html": null}, {"slug": "spine_chart", "title": "Spine Chart (opposing bars)", "family": "01_deviation", "familyName": "Deviation", "purpose": "Two sets of bars extend in opposite directions from a central spine. It splits one total into two opposing components (for example, for vs. against, or imports vs. exports) for each category.", "use": ["Show two opposing components per category (wins/losses, inflow/outflow, men/women)", "Show each category's balance and its gross volume together"], "avoid": ["The two components are not opposites", "The categories are age bands (that is a population pyramid; see Distribution)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/spine_chart.png", "ipynb": "../01_deviation/spine_chart/spine_chart.ipynb", "py": "../01_deviation/spine_chart/spine_chart.py", "html": null}, {"slug": "scatter", "title": "Scatter Plot", "family": "02_correlation", "familyName": "Correlation", "purpose": "Each observation is a dot placed by two numeric variables. It is the basic chart for relationships: the direction, strength, shape (linear or curved), clusters and outliers all show at once.", "use": ["Show whether two numeric variables move together", "Find clusters, gaps and outliers in two-dimensional data", "Explore data before fitting a model"], "avoid": ["There are tens of thousands of points and heavy overplotting (use hexbin or 2-D density)", "One variable is time (use a line chart)", "Readers need exact values (use a table)"], "engine": "mpl", "real": true, "shapes": ["numeric", "categories"], "alts": ["plotly", "altair"], "level": "basic", "animated": false, "thumb": "thumbs/scatter.png", "ipynb": "../02_correlation/scatter/scatter.ipynb", "py": "../02_correlation/scatter/scatter.py", "html": null}, {"slug": "scatter_regression", "title": "Scatter with Regression Line", "family": "02_correlation", "familyName": "Correlation", "purpose": "A scatter plot with a fitted trend line and its confidence band. The fit summarises the relationship, the band shows how certain the estimate is, and the raw points stay visible as evidence.", "use": ["Show the direction and strength of a roughly linear relationship", "Report a correlation coefficient or slope alongside the data", "Show model fit and the uncertainty around it"], "avoid": ["The relationship is clearly non-linear (use LOWESS or a polynomial fit)", "Readers might read the trend line as proof of causation", "Outliers dominate the fit (check robust alternatives first)"], "engine": "mpl", "real": true, "shapes": ["numeric"], "alts": ["plotly"], "level": "intermediate", "animated": false, "thumb": "thumbs/scatter_regression.png", "ipynb": "../02_correlation/scatter_regression/scatter_regression.ipynb", "py": "../02_correlation/scatter_regression/scatter_regression.py", "html": null}, {"slug": "bubble", "title": "Bubble Chart", "family": "02_correlation", "familyName": "Correlation", "purpose": "A scatter plot whose marker area encodes a third numeric variable. Three measures fit in one view, with the size channel adding emphasis.", "use": ["Show three numeric variables at once (x, y, and size)", "Show entities whose size or weight matters (population, revenue)", "Tell a 'Gapminder-style' story about countries or companies"], "avoid": ["Precise comparison of the third variable matters (area is judged poorly)", "There are many bubbles that overlap heavily", "Sizes span several orders of magnitude without scaling"], "engine": "mpl", "real": true, "shapes": ["numeric", "categories"], "alts": ["plotly"], "level": "basic", "animated": false, "thumb": "thumbs/bubble.png", "ipynb": "../02_correlation/bubble/bubble.ipynb", "py": "../02_correlation/bubble/bubble.py", "html": null}, {"slug": "connected_scatter", "title": "Connected Scatter Plot", "family": "02_correlation", "familyName": "Correlation", "purpose": "A scatter plot whose points are joined in time order. It shows how the relationship between two variables changes over time, including loops, reversals and turning points.", "use": ["Show how two variables evolved together over time (e.g. unemployment vs. inflation)", "Show cycles and path dependency that two separate line charts would hide"], "avoid": ["The audience is unfamiliar with the form (it needs annotation to be read)", "There are many time points or a path that crosses itself a lot", "There are several series (paths tangle)"], "engine": "mpl", "real": false, "shapes": ["numeric", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/connected_scatter.png", "ipynb": "../02_correlation/connected_scatter/connected_scatter.ipynb", "py": "../02_correlation/connected_scatter/connected_scatter.py", "html": null}, {"slug": "correlation_heatmap", "title": "Correlation Matrix Heatmap", "family": "02_correlation", "familyName": "Correlation", "purpose": "A grid that colors each cell by the correlation coefficient between a pair of variables. Strong positive and negative relationships across many variables stand out in one view.", "use": ["Screen many numeric variables for pairwise relationships", "Spot multicollinearity before regression modelling", "Summarise a feature set in a report"], "avoid": ["Relationships are non-linear (Pearson r can miss them; check scatter plots)", "There are more than ~25 variables (cluster or filter first)"], "engine": "mpl", "real": true, "shapes": ["numeric", "prices"], "alts": ["plotly"], "level": "intermediate", "animated": false, "thumb": "thumbs/correlation_heatmap.png", "ipynb": "../02_correlation/correlation_heatmap/correlation_heatmap.ipynb", "py": "../02_correlation/correlation_heatmap/correlation_heatmap.py", "html": null}, {"slug": "hexbin", "title": "Hexbin Plot", "family": "02_correlation", "familyName": "Correlation", "purpose": "Bins a large scatter into hexagonal cells colored by point count. It replaces an unreadable blob of overplotted points with a readable density surface.", "use": ["Show a two-variable relationship with thousands to millions of points", "Show where the data is concentrated, not just its extent"], "avoid": ["There are only a few hundred points (a scatter shows individual points better)", "Individual outliers matter (binning hides them)"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/hexbin.png", "ipynb": "../02_correlation/hexbin/hexbin.ipynb", "py": "../02_correlation/hexbin/hexbin.py", "html": null}, {"slug": "density_contour_2d", "title": "2-D Density Contour Plot", "family": "02_correlation", "familyName": "Correlation", "purpose": "Estimates the joint probability density of two variables and draws it as filled contour bands, like a topographic map. It shows peaks (modes) and the shape of the joint distribution.", "use": ["Show where two variables jointly concentrate in large datasets", "Reveal multiple clusters or modes", "Compare the joint distributions of two or three groups"], "avoid": ["There are few data points (KDE invents smooth structure)", "Exact counts are needed"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/density_contour_2d.png", "ipynb": "../02_correlation/density_contour_2d/density_contour_2d.ipynb", "py": "../02_correlation/density_contour_2d/density_contour_2d.py", "html": null}, {"slug": "pair_plot", "title": "Pair Plot (Scatter-plot Matrix)", "family": "02_correlation", "familyName": "Correlation", "purpose": "A grid of scatter plots for every pair of variables, with each variable's distribution on the diagonal. It is a standard first look at a multivariate dataset.", "use": ["Explore relationships among 3–6 numeric variables at once", "Check how well groups separate across features (classification problems)", "Find non-linear relationships that a correlation matrix would miss"], "avoid": ["There are more than ~6 variables (the panels get tiny)", "The audience is non-technical (too dense for presentation)"], "engine": "mpl", "real": true, "shapes": ["numeric", "categories"], "alts": ["plotly"], "level": "intermediate", "animated": false, "thumb": "thumbs/pair_plot.png", "ipynb": "../02_correlation/pair_plot/pair_plot.ipynb", "py": "../02_correlation/pair_plot/pair_plot.py", "html": null}, {"slug": "joint_plot", "title": "Joint Plot (Scatter + Marginals)", "family": "02_correlation", "familyName": "Correlation", "purpose": "A scatter plot with the marginal distribution of each variable drawn along its axis. The joint relationship and both individual distributions show together.", "use": ["Show both the relationship and each variable's skew or outliers", "Explore two key variables in detail"], "avoid": ["There are more than two or three groups (marginals get crowded)", "Space is tight (dashboard tiles)"], "engine": "mpl", "real": true, "shapes": ["numeric"], "alts": ["plotly"], "level": "intermediate", "animated": false, "thumb": "thumbs/joint_plot.png", "ipynb": "../02_correlation/joint_plot/joint_plot.ipynb", "py": "../02_correlation/joint_plot/joint_plot.py", "html": null}, {"slug": "pca_biplot", "title": "PCA Biplot", "family": "02_correlation", "familyName": "Correlation", "purpose": "Projects many correlated numeric variables onto the first two principal components. It draws the observations as points and the original variables as arrows (loadings), so you see at once how the samples group and which variables drive that grouping.", "use": ["Get an overview of a dataset with many numeric variables (5–50)", "See which variables pull observations apart, and which variables are correlated (arrows pointing the same way)", "Check visually whether known groups separate in the main directions of variation"], "avoid": ["The first two components explain little of the variance (check the axis labels; under ~40% the picture is misleading)", "Variables are on different scales and you have not standardized them", "The audience is non-technical (principal components have no plain-language units)"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/pca_biplot.png", "ipynb": "../02_correlation/pca_biplot/pca_biplot.ipynb", "py": "../02_correlation/pca_biplot/pca_biplot.py", "html": null}, {"slug": "tsne_embedding", "title": "t-SNE / UMAP Embedding", "family": "02_correlation", "familyName": "Correlation", "purpose": "A non-linear projection that places observations with similar profiles near each other in 2-D. It shows local neighbourhoods, clusters and how well labelled groups separate in high-dimensional data.", "use": ["Explore whether high-dimensional samples (patients, cells, documents) form clusters", "Check whether known labels correspond to natural groupings in the features", "Present single-cell, omics or embedding-model output"], "avoid": ["You want to read distances or sizes between clusters (t-SNE does not preserve them)", "The axes would be interpreted as variables (they have no meaning)", "There are few variables, or a linear method such as PCA already shows the structure"], "engine": "mpl", "real": false, "shapes": ["numeric", "categories"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/tsne_embedding.png", "ipynb": "../02_correlation/tsne_embedding/tsne_embedding.ipynb", "py": "../02_correlation/tsne_embedding/tsne_embedding.py", "html": null}, {"slug": "ordered_bar", "title": "Ordered Horizontal Bar Chart", "family": "03_ranking", "familyName": "Ranking", "purpose": "Horizontal bars sorted from largest to smallest. Sorting turns comparison into a ranking that reads top to bottom, and horizontal bars leave room for long category labels.", "use": ["Rank categories by a single value (top 10 products, countries, causes)", "Show categories with long names", "Highlight where one item of interest sits in the ranking"], "avoid": ["The categories have a natural order (months, age bands): keep that order instead", "There are more than ~25 categories (show the top N and fold the rest into 'Other')"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/ordered_bar.png", "ipynb": "../03_ranking/ordered_bar/ordered_bar.ipynb", "py": "../03_ranking/ordered_bar/ordered_bar.py", "html": null}, {"slug": "ordered_column", "title": "Ordered Column Chart", "family": "03_ranking", "familyName": "Ranking", "purpose": "Vertical bars sorted by value. It works like the ordered bar chart, but suits short labels and layouts that are wider than they are tall.", "use": ["Rank a handful of categories with short names", "Fit a ranking into a wide slide or dashboard slot"], "avoid": ["Labels are long (they must be rotated, so use horizontal bars)", "The x-axis is time (columns would suggest a sequence, not a rank)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/ordered_column.png", "ipynb": "../03_ranking/ordered_column/ordered_column.ipynb", "py": "../03_ranking/ordered_column/ordered_column.py", "html": null}, {"slug": "lollipop_ranking", "title": "Lollipop Chart", "family": "03_ranking", "familyName": "Ranking", "purpose": "A thin stem with a dot at the value. It encodes the same thing as a bar but with far less ink, so long rankings look lighter and the endpoints stand out.", "use": ["Show rankings with many items (15–40) where bars would form a heavy block", "Show values that are all large and similar, where the endpoints matter"], "avoid": ["The axis does not start at zero (the stem length then misleads)", "There are very few categories (a bar chart is more familiar)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/lollipop_ranking.png", "ipynb": "../03_ranking/lollipop_ranking/lollipop_ranking.ipynb", "py": "../03_ranking/lollipop_ranking/lollipop_ranking.py", "html": null}, {"slug": "cleveland_dot", "title": "Cleveland Dot Plot", "family": "03_ranking", "familyName": "Ranking", "purpose": "Dots on a common scale, one row per category, sorted by value. Without bars the axis need not start at zero, so small differences between similar values become visible.", "use": ["Rank values that are close together and far from zero (e.g. life expectancy 70–85)", "Compare two values per category (before/after, men/women) on each row"], "avoid": ["Readers will judge proportions from position (start at zero or use bars)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/cleveland_dot.png", "ipynb": "../03_ranking/cleveland_dot/cleveland_dot.ipynb", "py": "../03_ranking/cleveland_dot/cleveland_dot.py", "html": null}, {"slug": "dot_strip_plot", "title": "Dot Strip Plot (rank position)", "family": "03_ranking", "familyName": "Ranking", "purpose": "Places every item as a dot along a single value axis, one strip per group, with the item of interest highlighted. It shows where one entity ranks within each of several measures.", "use": [" ", "ipynb": "../05_change_over_time/gantt_chart/gantt_chart.ipynb", "py": "../05_change_over_time/gantt_chart/gantt_chart.py", "html": null}, {"slug": "sparklines", "title": "Sparklines", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Tiny, word-sized line charts with no axes, set next to numbers in a table or text (the term was coined by Edward Tufte). They add the shape of the recent trend to each figure at very little cost in space.", "use": ["Dashboards and tables where each row needs trend context", "Show general shape (up, down, volatile) for many metrics at once"], "avoid": ["Readers need actual values or comparisons between rows' scales", "The trend is the main story (give it a full chart)"], "engine": "mpl", "real": false, "shapes": ["time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/sparklines.png", "ipynb": "../05_change_over_time/sparklines/sparklines.ipynb", "py": "../05_change_over_time/sparklines/sparklines.py", "html": null}, {"slug": "seasonal_cycle_plot", "title": "Seasonal (Cycle) Plot", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Overlays each year as its own line on a shared month axis, or groups values by season. Seasonal patterns can be compared year against year, which a long continuous line hides.", "use": ["Data has a strong seasonal cycle (retail, energy demand, flu cases, tourism)", "Ask whether this year's season is unusual compared with past years"], "avoid": ["There is no repeating cycle", "Many years would overlap into an unreadable bundle (highlight the latest year)"], "engine": "mpl", "real": false, "shapes": ["time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/seasonal_cycle_plot.png", "ipynb": "../05_change_over_time/seasonal_cycle_plot/seasonal_cycle_plot.ipynb", "py": "../05_change_over_time/seasonal_cycle_plot/seasonal_cycle_plot.py", "html": null}, {"slug": "indexed_line", "title": "Indexed Line Chart (rebased to 100)", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Divides each series by its value at a common start date and multiplies by 100, so all series start at 100 and show relative growth. It is the honest replacement for a dual-axis chart when series have very different units or scales.", "use": ["Compare growth of series with very different magnitudes (a small-cap vs. an index)", "You are tempted to use a second y-axis. Index instead, so there is one honest scale", "Show performance since an event (rebased at the event date)"], "avoid": ["Absolute levels matter more than relative change", "The base period is unusual (spike or trough), which distorts every later value"], "engine": "mpl", "real": true, "shapes": ["time", "prices"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/indexed_line.png", "ipynb": "../05_change_over_time/indexed_line/indexed_line.ipynb", "py": "../05_change_over_time/indexed_line/indexed_line.py", "html": null}, {"slug": "event_timeline", "title": "Event Timeline", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Places labelled events along a time axis, with stems alternating above and below so labels don't collide. It shows chronology, gaps and the density of events at a glance.", "use": ["Tell a historical narrative or company milestones", "Show when discrete events happened relative to each other", "Annotate the context behind changes seen in another chart"], "avoid": ["The events have quantitative values to compare (use a chart with a value axis)", "There are dozens of events that would cram together (filter to key ones)"], "engine": "mpl", "real": false, "shapes": ["time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/event_timeline.png", "ipynb": "../05_change_over_time/event_timeline/event_timeline.ipynb", "py": "../05_change_over_time/event_timeline/event_timeline.py", "html": null}, {"slug": "acf_pacf", "title": "ACF & PACF (Autocorrelation Plots)", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Shows how strongly a time series is correlated with its own past. The autocorrelation function (ACF) shows the correlation at each lag; the partial autocorrelation function (PACF) shows each lag's correlation after removing the effect of shorter lags. Bars outside the confidence band reveal memory and seasonality, and their pattern suggests which ARIMA-type model fits.", "use": ["Check for seasonality and its period (spikes at lags 7, 12, 52…)", "Choose AR and MA orders before fitting a forecasting model", "Test whether model residuals are white noise (no bars should cross the band)"], "avoid": ["The series has a strong trend (difference or detrend it first, or every lag looks significant)", "The audience is non-technical (show the seasonal pattern directly instead)"], "engine": "mpl", "real": false, "shapes": ["time", "model"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/acf_pacf.png", "ipynb": "../05_change_over_time/acf_pacf/acf_pacf.ipynb", "py": "../05_change_over_time/acf_pacf/acf_pacf.py", "html": null}, {"slug": "stl_decomposition", "title": "STL Decomposition (Trend / Seasonal / Residual)", "family": "05_change_over_time", "familyName": "Change over time", "purpose": "Splits a time series into three additive parts with STL (Seasonal-Trend decomposition using LOESS): a smooth trend, a repeating seasonal pattern that can change slowly, and a residual. Stacked panels on a shared time axis separate the questions \"is it growing?\", \"what is the seasonal pattern?\" and \"was this month unusual?\", which a single line mixes together.", "use": ["Separate long-term growth from seasonality before reporting a trend", "Find unusual periods (large residuals) such as outages, strikes or promotions", "Check whether the seasonal pattern is changing over time"], "avoid": ["The series has no clear seasonality or is very short (fewer than Radar (Spider) Chart", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "Plots several variables on axes radiating from a center and joins them into a polygon. Each entity's overall profile reads as a shape.", "use": ["Compare the profile of 1–3 entities across 4–8 variables on the same scale (skills, product attributes)", "Show balance and strengths or weaknesses more than precise values"], "avoid": ["Variables use different units or scales (normalise first, or use a different chart)", "Comparing more than ~3 entities (polygons overlap; use small multiples or parallel coordinates)", "Precise comparison is required (radial distances and areas are hard to judge)"], "engine": "mpl", "real": true, "shapes": ["categories", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/radar_chart.png", "ipynb": "../06_magnitude/radar_chart/radar_chart.ipynb", "py": "../06_magnitude/radar_chart/radar_chart.py", "html": null}, {"slug": "parallel_coordinates", "title": "Parallel Coordinates", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "Each variable gets a vertical axis and each observation is a line crossing every axis. Patterns, clusters and trade-offs across many dimensions become visible.", "use": ["Explore multivariate data (4–12 numeric variables) for clusters and trade-offs", "Compare groups on many attributes at once", "Use interactive filtering (brushing) of high-dimensional records"], "avoid": ["General audiences (the chart takes explanation)", "Thousands of lines would overplot (sample, aggregate, or use alpha)"], "engine": "mpl", "real": true, "shapes": ["numeric", "categories"], "alts": ["plotly"], "level": "intermediate", "animated": false, "thumb": "thumbs/parallel_coordinates.png", "ipynb": "../06_magnitude/parallel_coordinates/parallel_coordinates.ipynb", "py": "../06_magnitude/parallel_coordinates/parallel_coordinates.py", "html": null}, {"slug": "bullet_chart", "title": "Bullet Chart", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "Stephen Few's compact replacement for gauges. A bar shows the actual value, a tick marks the target, and shaded bands mark qualitative ranges (poor, ok, good), all in a small strip.", "use": ["Show KPI performance against target and qualitative thresholds in dashboards", "Fit many metrics into little space (stack them vertically)"], "avoid": ["There is no target or benchmark", "The audience is unfamiliar with it and has no legend to explain it"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/bullet_chart.png", "ipynb": "../06_magnitude/bullet_chart/bullet_chart.ipynb", "py": "../06_magnitude/bullet_chart/bullet_chart.py", "html": null}, {"slug": "pictogram_isotype", "title": "Pictogram / Isotype Chart", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "Represents quantities by counting repeated icons (Otto Neurath's Isotype). It turns abstract numbers into countable things for general and infographic audiences.", "use": ["Communicate counts or ratios to a broad public ('3 in 10 people…')", "Engagement and memorability matter more than precision", "Quantities are small, whole numbers or can be rounded to units"], "avoid": ["Values need precision (fractional icons are hard to read)", "Icons are scaled by size instead of count (area distorts perception)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/pictogram_isotype.png", "ipynb": "../06_magnitude/pictogram_isotype/pictogram_isotype.ipynb", "py": "../06_magnitude/pictogram_isotype/pictogram_isotype.py", "html": null}, {"slug": "packed_bubbles", "title": "Packed Bubble Chart (proportional symbols)", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "Circles sized by value and packed together without axes. It gives a quick, attractive impression of which items are big and which are small.", "use": ["Show orders of magnitude when values differ greatly (large vs. small players)", "Editorial or overview graphics where precision is secondary"], "avoid": ["Values are close (people cannot compare circle areas precisely)", "Exact comparison or ranking is needed (use bars)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric", "hierarchy"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/packed_bubbles.png", "ipynb": "../06_magnitude/packed_bubbles/packed_bubbles.ipynb", "py": "../06_magnitude/packed_bubbles/packed_bubbles.py", "html": null}, {"slug": "kpi_stat_tile", "title": "KPI Stat Tile (big number)", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "When the story is one number, the best chart is the number itself. A large value with a label, a change versus a comparison period, and an optional sparkline answers 'how are we doing?' instantly.", "use": ["A single headline metric (one-bar charts and 2-slice pies should be tiles instead)", "Show the top row of a dashboard", "Show a value whose context is a change versus last period or target"], "avoid": ["Comparisons between many items are needed (use a chart)", "The number is meaningless without a distribution or trend (add a sparkline or chart)"], "engine": "mpl", "real": false, "shapes": ["numeric", "time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/kpi_stat_tile.png", "ipynb": "../06_magnitude/kpi_stat_tile/kpi_stat_tile.ipynb", "py": "../06_magnitude/kpi_stat_tile/kpi_stat_tile.py", "html": null}, {"slug": "highlight_table", "title": "Highlight Table (heat-shaded table)", "family": "06_magnitude", "familyName": "Magnitude", "purpose": "A table of numbers with each cell shaded by its value. Readers can look up exact values and still see high and low cells at a glance, which makes it a bridge between a table and a heatmap.", "use": ["Readers need exact numbers and patterns (finance reports, cross se a bar chart)", "Slices are close in size and the difference matters", "Comparing several pies side by side (use a 100% stacked bar)", "The parts don't add up to a meaningful whole", "3-D or exploded pies, which distort the angles"], "engine": "mpl", "real": false, "shapes": ["categories"], "alts": ["plotly"], "level": "basic", "animated": false, "thumb": "thumbs/pie_chart.png", "ipynb": "../07_part_to_whole/pie_chart/pie_chart.ipynb", "py": "../07_part_to_whole/pie_chart/pie_chart.py", "html": null}, {"slug": "donut_chart", "title": "Donut Chart", "family": "07_part_to_whole", "familyName": "Part-to-whole", "purpose": "A pie chart with the center removed. Readers judge arc length rather than angle, and the hole holds a headline number such as the total or the key share. The same limits as a pie apply.", "use": ["Show a part-to-whole split with few categories (≤ 6) and a headline figure", "Dashboards where a single compact share indicator is needed"], "avoid": ["There are more than 6 segments, or the segments are close in size", "Precise comparison is needed (use a bar chart)"], "engine": "mpl", "real": false, "shapes": ["categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/donut_chart.png", "ipynb": "../07_part_to_whole/donut_chart/donut_chart.ipynb", "py": "../07_part_to_whole/donut_chart/donut_chart.py", "html": null}, {"slug": "treemap", "title": "Treemap", "family": "07_part_to_whole", "familyName": "Part-to-whole", "purpose": "Nested rectangles whose areas are proportional to values. It fits a large number of parts (and optionally a hierarchy) into a small space, and the biggest contributors stand out.", "use": ["Show part-to-whole with many categories (10–50+) where a pie would fail", "Show hierarchical data (sector → company), coloring by the parent", "Find the dominant contributors in a long tail"], "avoid": ["Precise comparison of similar values is needed (areas are hard to compare)", "Values can be negative", "There are very few categories (use a bar chart)"], "engine": "mpl", "real": false, "shapes": ["hierarchy"], "alts": ["plotly"], "level": "basic", "animated": false, "thumb": "thumbs/treemap.png", "ipynb": "../07_part_to_whole/treemap/treemap.ipynb", "py": "../07_part_to_whole/treemap/treemap.py", "html": null}, {"slug": "sunburst", "title": "Sunburst Chart", "family": "07_part_to_whole", "familyName": "Part-to-whole", "purpose": "Concentric rings that show a hierarchy. The center is the root and each ring outward is one level deeper. Each arc's angle is proportional to its value. In the interactive version, clicking a segment zooms into that branch.", "use": ["Show part-to-whole across 2–4 levels of hierarchy", "Exploring how a total breaks down (budget → department → line item)", "Interactive contexts where users can drill down"], "avoid": ["Precise comparison is needed (outer arcs are distorted by radius)", "The hierarchy is deeper than ~4 levels or very unbalanced", "Static print with many small segments"], "engine": "plotly", "real": false, "shapes": ["hierarchy"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/sunburst.png", "ipynb": "../07_part_to_whole/sunburst/sunburst.ipynb", "py": "../07_part_to_whole/sunburst/sunburst.py", "html": "../07_part_to_whole/sunburst/sunburst.html"}, {"slug": "icicle", "title": "Icicle Chart", "family": "07_part_to_whole", "familyName": "Part-to-whole", "purpose": "A rectangular, linear version of the sunburst. Each hierarchy level is a row (or column), and each child sits directly under its parent with a width proportional to its value. Straight edges are easier to compare than arcs, and long labels fit better.", "use": ["Show hierarchical part-to-whole where labels are long", "Show file-system sizes, cost breakdowns, or org structures", "Need accurate comparison at every level of a hierarchy"], "avoid": ["The hierarchy has only one level (use a bar or treemap)", "There are hundreds of leaves (use a treemap)"], "engin tml": "../09_flow/sankey/sankey.html"}, {"slug": "alluvial", "title": "Alluvial Diagram (Parallel Categories)", "family": "09_flow", "familyName": "Flow", "purpose": "Several categorical dimensions are drawn as vertical axes with ribbons connecting them. Each ribbon is the group of records sharing a combination of categories. It shows how membership in one classification maps onto another, or how groups change over time.", "use": ["Show how individuals move between categories over time (plan tier in 2024 → 2025)", "Explore associations among 2–4 categorical variables", "Track cohort composition across stages"], "avoid": ["Variables are continuous (use parallel coordinates)", "Each dimension has many categories (ribbons become unreadable)"], "engine": "plotly", "real": false, "shapes": ["categories", "flows"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/alluvial.png", "ipynb": "../09_flow/alluvial/alluvial.ipynb", "py": "../09_flow/alluvial/alluvial.py", "html": "../09_flow/alluvial/alluvial.html"}, {"slug": "funnel_chart", "title": "Funnel Chart", "family": "09_flow", "familyName": "Flow", "purpose": "A sequence of centered bars, one per stage of a process, each no larger than the one before. It shows how many items remain at each step and where the largest drop-offs occur.", "use": ["Show a sales or marketing conversion pipeline (visit → sign-up → purchase)", "Show applicant screening pipelines (loan applications, hiring, trial recruitment)", "Find the stage with the biggest loss"], "avoid": ["Stages are not strictly sequential or subsets of each other", "Values can increase between stages (use a bar chart or waterfall)"], "engine": "mpl", "real": false, "shapes": ["categories", "flows"], "alts": ["plotly"], "level": "basic", "animated": false, "thumb": "thumbs/funnel_chart.png", "ipynb": "../09_flow/funnel_chart/funnel_chart.ipynb", "py": "../09_flow/funnel_chart/funnel_chart.py", "html": null}, {"slug": "chord_diagram", "title": "Chor "Flow", "purpose": "Leaves of a hierarchy sit around a circle, grouped by parent. Each connection is drawn as a B-spline routed through the hierarchy (leaf → parent → root → parent → leaf), so edges between the same groups bundle into a shared \"cable\". This turns the hairball of a dense network into readable group-to-group traffic while keeping every individual link.", "use": ["Show many connections (100s) between items that belong to a known hierarchy", "Reveal which groups depend on which, e.g. module imports, interbank exposures, team communication", "Find unexpected links that leave their group's main bundle"], "avoid": ["There is no meaningful hierarchy to route edges through (use a force-directed network or matrix)", "Readers need exact weights or the direction of every edge (use an adjacency matrix)", "Only a handful of edges exist (a plain network or arc diagram is simpler)"], "engine": "mpl", "real": false, "shapes": ["flows", "hierarchy"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/hierarchical_edge_bundling.png", "ipynb": "../09_flow/hierarchical_edge_bundling/hierarchical_edge_bundling.ipynb", "py": "../09_flow/hierarchical_edge_bundling/hierarchical_edge_bundling.py", "html": null}, {"slug": "adjacency_matrix", "title": "Adjacency Matrix (ordered)", "family": "09_flow", "familyName": "Flow", "purpose": "A network drawn as a grid: one row and one column per node, with each cell shaded by the strength of the link between them. The power is in the ordering. Reordered so that similar nodes sit together, clusters appear as dark blocks on the diagonal, and every link stays visible without the overlap of node-link diagrams.", "use": ["Show dense networks (dozens to hundreds of nodes) where a node-link drawing becomes a hairball", "Reveal communities, bridges and outliers by reordering rows and columns", "Show weighted links precisely (overlap, exposure, correlation, message counts)"], "avoid": ["Readers need to trace paths through several hops (node-link diagrams show paths better)", "The network is small and sparse (a network graph is more intuitive)", "Rows are left in arbitrary (e.g. alphabetical) order, which hides all structure"], "engine": "mpl", "real": false, "shapes": ["flows"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/adjacency_matrix.png", "ipynb": "../09_flow/adjacency_matrix/adjacency_matrix.ipynb", "py": "../09_flow/adjacency_matrix/adjacency_matrix.py", "html": null}, {"slug": "performance_tear_sheet", "title": "Performance Tear Sheet (one-page report)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A one-page report that combines the charts and statistics an investor checks first: headline metrics, growth of $1 against a benchmark, drawdowns, rolling risk, a monthly-returns calendar and calendar-year returns. Return, risk and consistency read together, so no single flattering number tells the story alone.", "use": ["Summarise a fund, strategy, or portfolio's track record on one page", "Compare a strategy with its benchmark across return, risk and consistency", "Produce a repeatable monthly or quarterly performance report from a price file"], "avoid": ["The history is short (under ~2 years); rolling and calendar panels become noise", "The audience needs one message (show the single relevant chart instead)", "Returns are not time-weighted (cash flows distort them; compute TWR first)"], "engine": "mpl", "real": true, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/performance_tear_sheet.png", "ipynb": "../10_finance_investment/performance_tear_sheet/performance_tear_sheet.ipynb", "py": "../10_finance_investment/performance_tear_sheet/performance_tear_sheet.py", "html": null}, {"slug": "cumulative_return_benchmark", "title": "Cumulative Return vs. Benchmark", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Shows the growth of an investment (for example, 10,000 invested at the start) for a fund and its benchmark on one log-scaled axis. On a log scale equal vertical distances mean equal percentage changes, so a 50% rise looks the same in 2015 as in 2024 and the slopes of the two lines compare growth rates directly.", "use": ["Compare long-run performance of a fund, strategy or stock against a benchmark", "Show compounding over many years, where a linear axis would flatten the early period", "Introduce a performance report before drilling into drawdowns and rolling metrics"], "avoid": ["The horizon is short (under a year) and percentage moves are small (a linear axis is fine)", "Comparing many funds at once (use a risk-return scatter or small multiples)", "The audience is unfamiliar with log axes and there is no space to explain them"], "engine": "mpl", "real": true, "shapes": ["prices", "time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/cumulative_return_benchmark.png", "ipynb": "../10_finance_investment/cumulative_return_benchmark/cumulative_return_benchmark.ipynb", "py": "../10_finance_investment/cumulative_return_benchmark/cumulative_return_benchmark.py", "html": null}, {"slug": "drawdown_underwater", "title": "Drawdown (Underwater) Chart", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots, for every date, how far an investment sits below its previous peak. The area hangs \"underwater\" from a zero line, so the depth, length and frequency of losses become visible. A cumulative-return chart hides these, because recoveries quickly paint over the dips.", "use": ["Show the pain an investor would have experienced, not just the end result", "Compare maximum drawdown and time-to-recovery between strategies", "Pair with a cumulative-return chart in a performance report"], "avoid": ["The series never falls meaningfully below its peak (the chart is empty)", "Very short histories, where one dip dominates"], "engine": "mpl", "real": true, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/drawdown_underwater.png", "ipynb": "../10_finance_investment/drawdown_underwater/drawdown_underwater.ipynb", "py": "../10_finance_investment/drawdown_underwater/drawdown_underwater.py", "html": null}, {"slug": "monthly_returns_heatmap", "title": "Monthly Returns Heatmap (Calendar Table)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A year × month grid in which every cell is one month's return, colored on a diverging scale centered at zero, with the full-year return in a separate column. It is the standard compact view in fund factsheets: you can read exact numbers and also spot streaks, seasonality and bad years at a glance.", "use": ["Summarise a multi-year monthly track record on one page", "Look for streaks of losses, seasonality or a change in behavior after a given date", "Give readers exact monthly figures alongside the pattern"], "avoid": ["Fewer than about two years of history (use a bar chart of monthly returns)", "Comparing two funds (use annual returns bars or a difference heatmap)"], "engine": "mpl", "real": true, "shapes": ["prices", "time"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/monthly_returns_heatmap.png", "ipynb": "../10_finance_investment/monthly_returns_heatmap/monthly_returns_heatmap.ipynb", "py": "../10_finance_investment/monthly_returns_heatmap/monthly_returns_heatmap.py", "html": null}, {"slug": "annual_returns_bar", "title": "Annual Returns vs. Benchmark", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Paired columns showing a fund's and its benchmark's return for each calendar year, with a lower panel of the yearly difference (excess return). Calendar-year returns are what regulators and factsheets report, and the pairing shows at once in which years the fund helped or hurt.", "use": ["Report calendar-year performance against a benchmark", "Show whether out- or under-performance is consistent or driven by a few years", "Complement a cumulative-return chart, which hides year-to-year variation"], "avoid": ["More than about 15 years (switch to a line of rolling returns)", "More than two or three series (bars become a picket fence; use a heatmap)"], "engine": "mpl", "real": false, "shapes": ["prices", "time", "categories"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/annual_returns_bar.png", "ipynb": "../10_finance_investment/annual_returns_bar/annual_returns_bar.ipynb", "py": "../10_finance_investment/annual_returns_bar/annual_returns_bar.py", "html": null}, {"slug": "rolling_metrics", "title": "Rolling Return, Volatility and Sharpe", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Three stacked panels sharing one time axis: trailing 12-month return, annualised volatility and Sharpe ratio, each for the fund and its benchmark. A single full-period number hides regime changes; rolling windows show whether performance and risk were stable or came from one lucky stretch.", "use": ["Check whether a strategy's edge is persistent or concentrated in one period", "Show how risk (volatility) changes across market regimes", "Monitor a live fund against its benchmark over time"], "avoid": ["Histories shorter than about three window lengths (the lines are mostly noise)", "Mixing metrics with different units on a dual y-axis (use stacked panels, as here)"], "engine": "mpl", "real": true, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/rolling_metrics.png", "ipynb": "../10_finance_investment/rolling_metrics/rolling_metrics.ipynb", "py": "../10_finance_investment/rolling_metrics/rolling_metrics.py", "html": null}, {"slug": "return_distribution_var", "title": "Return Distribution with VaR and CVaR", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A histogram of periodic returns with a fitted normal curve and the historical Value-at-Risk (VaR) and Conditional VaR (CVaR, expected shortfall) marked. A second panel uses a log density scale so the fat left tail is visible. Real returns have more extreme days than a normal distribution predicts, and risk models that assume normality understate losses.", "use": ["Explain tail risk and what VaR / CVaR actually measure", "Show that returns are fat-tailed or skewed compared with a normal model", "Compare the loss distribution of two strategies (overlay or small multiples)"], "avoid": ["Fewer than a few hundred observations (the tails are not estimable)", "The audience only needs a single risk number (use a stat tile with the VaR)"], "engine": "mpl", "real": true, "shapes": ["prices", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/return_distribution_var.png", "ipynb": "../10_finance_investment/return_distribution_var/return_distribution_var.ipynb", "py": "../10_finance_investment/return_distribution_var/return_distribution_var.py", "html": null}, {"slug": "rolling_correlation", "title": "Rolling Correlation", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots the correlation between two assets computed over a moving window. Diversification depends on correlation, and correlation is not constant: it shifts with inflation and policy regimes and tends to rise in crises, exactly when diversification is needed most.", "use": ["Check whether a diversifier (bonds, gold, alternatives) still diversifies", "Show regime changes in the relationship between two markets", "Stress-test assumptions in a portfolio model that uses a single correlation number"], "avoid": ["Comparing more than three or four pairs on one chart (use small multiples or a heatmap per period)", "Windows so short that the line is pure noise (under ~40 observations)"], "engine": "mpl", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/rolling_correlation.png", "ipynb": "../10_finance_investment/rolling_correlation/rolling_correlation.ipynb", "py": "../10_finance_investment/rolling_correlation/rolling_correlation.py", "html": null}, {"slug": "risk_contribution", "title": "Risk Contribution vs. Capital Weight", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Paired horizontal bars compare each asset's share of the capital with its share of the portfolio's total risk (volatility). In most portfolios the two differ sharply. A classic \"60/40\" portfolio gets most of its risk from equities, so the capital weights alone give a misleading picture of diversification.", "use": ["Show where a portfolio's risk really comes from", "Explain risk-parity or risk-budgeting approaches", "Review a proposed allocation before it is implemented"], "avoid": ["More than about 12 holdings (aggregate to asset classes or sectors first)", "The audience has not been introduced to volatility as the risk measure"], "engine": "mpl", "real": true, "shapes": ["prices", "categories"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/risk_contribution.png", "ipynb": "../10_finance_investment/risk_contribution/risk_contribution.ipynb", "py": "../10_finance_investment/risk_contribution/risk_contribution.py", "html": null}, {"slug": "stress_test_tornado", "title": "Stress-Test Tornado Chart", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "For each risk factor, a horizontal bar runs from the portfolio's P&L under a downside shock to its P&L under an upside shock. Bars are sorted by total range, so the widest (most important) sensitivities sit at the top and the chart narrows like a tornado. It ranks which assumptions matter most.", "use": ["Rank the sensitivity of a portfolio, valuation or budget to individual assumptions", "Communicate scenario or stress-test results to non-specialists", "Decide which inputs deserve more research or hedging"], "avoid": ["Factors interact strongly (one-at-a-time shocks mislead; use joint scenarios)", "Shocks are not comparable in likelihood (state the shock size for each bar)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/stress_test_tornado.png", "ipynb": "../10_finance_investment/stress_test_tornado/stress_test_tornado.ipynb", "py": "../10_finance_investment/stress_test_tornado/stress_test_tornado.py", "html": null}, {"slug": "efficient_frontier", "title": "Efficient Frontier", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots expected return against volatility for thousands of possible portfolios, traces the efficient frontier (the best return for each level of risk) and adds the capital market line from the risk-free rate through the tangency (maximum-Sharpe) portfolio. It is the picture behind modern portfolio theory: diversification moves portfolios up and to the left of the individual assets.", "use": ["Explain diversification and the risk-return trade-off", "Compare a proposed allocation with what is achievable from the same assets", "Teach mean-variance optimisation, the minimum-variance and maximum-Sharpe portfolios"], "avoid": ["Presenting the optimised weights as precise (they are very sensitive to expected-return estimates)", "Return estimates are just historical averages over a short period (the frontier will be overfitted)"], "engine": "mpl", "real": true, "shapes": ["prices", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/efficient_frontier.png", "ipynb": "../10_finance_investment/efficient_frontier/efficient_frontier.ipynb", "py": "../10_finance_investment/efficient_frontier/efficient_frontier.py", "html": null}, {"slug": "risk_return_scatter", "title": "Risk-Return Scatter", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Places each fund or asset by its annualised volatility (x) and annualised return (y), with lines of equal Sharpe ratio fanning out from the risk-free rate. It answers \"was the return worth the risk?\" for many investments at once, instead of comparing returns alone.", "use": ["Compare a fund with its peer group or a set of indices", "Screen many investments for risk-adjusted performance", "Show where a proposed portfolio sits relative to the alternatives"], "avoid": ["The periods differ between funds (statistics must cover the same dates)", "More than about 100 points without highlighting (it becomes a cloud; filter or highlight)"], "engine": "mpl", "real": true, "shapes": ["prices", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/risk_return_scatter.png", "ipynb": "../10_finance_investment/risk_return_scatter/risk_return_scatter.ipynb", "py": "../10_finance_investment/risk_return_scatter/risk_return_scatter.py", "html": null}, {"slug": "allocation_drift", "title": "Allocation Drift and Rebalancing", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Two 100% stacked area panels show how a portfolio's weights evolve when markets move: with periodic rebalancing the weights snap back to target, without it they drift towards whatever performed best. The comparison makes the hidden risk of \"set and forget\" visible: a 60/40 portfolio quietly becomes a much more aggressive one.", "use": ["Explain why and how often to rebalance", "Show how far a portfolio has drifted from its policy weights", "Compare rebalancing rules (calendar vs. threshold)"], "avoid": ["More than five or six holdings (group into asset classes)", "The weights barely move (show a small table instead)"], "engine": "mpl", "real": false, "shapes": ["prices", "time", "categories"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/allocation_drift.png", "ipynb": "../10_finance_investment/allocation_drift/allocation_drift.ipynb", "py": "../10_finance_investment/allocation_drift/allocation_drift.py", "html": null}, {"slug": "brinson_attribution", "title": "Performance Attribution (Brinson)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Decomposes a portfolio's excess return over its benchmark into allocation (over- or under-weighting sectors), selection (picking better or worse securities within sectors) and interaction effects, using the Brinson-Fachler model. A waterfall walks from the benchmark return to the portfolio return; a second panel shows the effects by sector, so you can see which decisions added or cost value.", "use": ["Explain why a fund beat or lagged its benchmark over a period", "Separate the value of sector calls from stock picking", "Report to investment committees or clients"], "avoid": ["Multi-period attribution without a proper linking method (effects do not simply add across periods)", "Strategies that are not managed by sector weights (use factor attribution instead)"], "engine": "mpl", "real": false, "shapes": ["categories", "numeric"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/brinson_attribution.png", "ipynb": "../10_finance_investment/brinson_attribution/brinson_attribution.ipynb", "py": "../10_finance_investment/brinson_attribution/brinson_attribution.py", "html": null}, {"slug": "factor_exposure", "title": "Factor Exposure (Betas with Confidence Intervals)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A dot-and-whisker chart of the coefficients from regressing a fund's excess returns on common risk factors (market, size, value, momentum, quality), with 95% confidence intervals. It reveals what a fund is really exposed to, and whether its \"alpha\" survives once those exposures are accounted for.", "use": ["Look past a fund's label to the systematic risks it takes", "Check whether outperformance is skill (alpha) or factor exposure", "Compare factor tilts across funds (small multiples or grouped dots)"], "avoid": ["Short histories (wide intervals make every coefficient look insignificant)", "Factors that are highly collinear (coefficients become unstable)"], "engine": "mpl", "real": false, "shapes": ["prices", "model", "uncertainty"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/factor_exposure.png", "ipynb": "../10_finance_investment/factor_exposure/factor_exposure.ipynb", "py": "../10_finance_investment/factor_exposure/factor_exposure.py", "html": null}, {"slug": "candlestick_ma_volume", "title": "Candlestick with Moving Averages, Bollinger Band & Volume", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "The technical analyst's standard price panel. Candles show each day's open, high, low and close. 20- and 50-day moving averages show trend, a Bollinger band shows how unusual the price is relative to its own recent volatility, and a separate volume panel shows conviction.", "use": ["Review a single security's recent price action with trend and volatility context", "Spot moving-average crossovers, band squeezes or breakouts, and volume spikes", "Present to trading or portfolio-management audiences who read this format daily"], "avoid": ["The audience only needs the trend (a line of closing prices is clearer)", "More than ~150 periods are shown (candles turn into noise; aggregate to weekly)", "Putting volume on a second y-axis over the price (always give it its own panel)"], "engine": "mpl", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/candlestick_ma_volume.png", "ipynb": "../10_finance_investment/candlestick_ma_volume/candlestick_ma_volume.ipynb", "py": "../10_finance_investment/candlestick_ma_volume/candlestick_ma_volume.py", "html": null}, {"slug": "sector_heatmap", "title": "Market Map (Sector Treemap Heatmap)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A treemap where each rectangle is a stock, sized by market capitalisation, grouped by sector and colored by the day's return. It answers two questions at once: what moved, and how much of the market it represents.", "use": ["Give a one-glance summary of the market or a portfolio on a given day or period", "Show whether a move is broad (whole sectors one color) or concentrated in a few large names", "Show many holdings (30–500) where size and return both matter"], "avoid": ["Precise comparison of returns is needed (use a sorted bar chart)", "Constituents are similar in size (the treemap adds nothing over a grid heatmap)", "Using a red/green scale alone (≈8% of men cannot separate them); use a blue/orange diverging scale"], "engine": "mpl", "real": false, "shapes": ["prices", "hierarchy"], "alts": [], "level": "basic", "animated": false, "thumb": "thumbs/sector_heatmap.png", "ipynb": "../10_finance_investment/sector_heatmap/sector_heatmap.ipynb", "py": "../10_finance_investment/sector_heatmap/sector_heatmap.py", "html": null}, {"slug": "relative_rotation_graph", "title": "Relative Rotation Graph (RRG)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots each sector's relative strength against a benchmark (x, RS-ratio) and the momentum of that relative strength (y, RS-momentum), with a short tail of recent weeks. Sectors tend to rotate clockwise through four quadrants (improving, leading, weakening, lagging), so the chart shows both where each one is and where it is heading.", "use": ["Compare sector or asset-class leadership relative to a benchmark", "See which groups are gaining or losing relative momentum before the trend is obvious", "Use as a sector-rotation dashboard for weekly reviews"], "avoid": ["The audience is unfamiliar with relative strength (start with a cumulative relative-return line)", "There are more than ~10 series (tails become spaghetti)", "Presenting it as a timing signal; it describes past relative performance and does not forecast"], "engine": "mpl", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/relative_rotation_graph.png", "ipynb": "../10_finance_investment/relative_rotation_graph/relative_rotation_graph.ipynb", "py": "../10_finance_investment/relative_rotation_graph/relative_rotation_graph.py", "html": null}, {"slug": "market_breadth", "title": "Market Breadth Panels", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Stacks a cap-weighted index above two breadth measures, the cumulative advance-decline line and the share of stocks above their 200-day moving average, on a shared time axis. It shows whether a rally is broad-based or carried by a few large companies.", "use": ["Check if an index move reflects most stocks or a handful of mega-caps", "Spot divergences, such as an index making new highs while breadth weakens", "Use as market-health context in investment commentary"], "avoid": ["Overlaying the measures on one chart with two or three y-axes (scales are arbitrary and imply false crossovers)", "The audience needs a single headline number (show % of stocks above the 200-day MA as a stat)"], "engine": "mpl", "real": false, "shapes": ["prices", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/market_breadth.png", "ipynb": "../10_finance_investment/market_breadth/market_breadth.ipynb", "py": "../10_finance_investment/market_breadth/market_breadth.py", "html": null}, {"slug": "yield_curve", "title": "Yield Curve (with Inversion)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots government bond yields against maturity for a few dates. The curve's shape (upward, flat or inverted) summarises market expectations for interest rates and growth. Shading where long rates fall below short rates makes inversion visible.", "use": ["Compare the term structure of interest rates at several points in time", "Explain an inversion (short rates above long rates), often watched as a recession signal", "Provide fixed-income context for asset-allocation or duration decisions"], "avoid": ["Spacing maturities evenly as categories without saying so (1M→3M is not the same gap as 10Y→30Y)", "More than 3–4 dates on one chart (use small multiples or the yield-curve history heatmap)"], "engine": "mpl", "real": false, "shapes": ["numeric", "time"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/yield_curve.png", "ipynb": "../10_finance_investment/yield_curve/yield_curve.ipynb", "py": "../10_finance_investment/yield_curve/yield_curve.py", "html": null}, {"slug": "yield_curve_history", "title": "Yield Curve History (Heatmap + Spread)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Shows the whole term structure through time as a heatmap (maturity × date, color = yield), with the 10Y–2Y spread in a panel below. Decades of rate cycles, curve flattening and inversions fit in one figure.", "use": ["Show how the entire yield curve evolved over years or decades", "Relate policy-rate cycles to curve shape and inversions", "Use as long-horizon macro context for fixed-income or allocation reports"], "avoid": ["Readers need exact yields on a given day (use a table or a single-date curve)", "Using a rainbow colormap (it creates false bands); use one hue, light to dark"], "engine": "mpl", "real": false, "shapes": ["time", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/yield_curve_history.png", "ipynb": "../10_finance_investment/yield_curve_history/yield_curve_history.ipynb", "py": "../10_finance_investment/yield_curve_history/yield_curve_history.py", "html": null}, {"slug": "option_payoff", "title": "Option Payoff Diagrams", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Plots profit or loss at expiry against the underlying price for an option strategy, with the premium paid or received included. Small multiples put several strategies side by side, so their risk profiles (capped, unlimited, range-bound) can be compared.", "use": ["Explain or compare option strategies (directional, hedging, volatility, income)", "Show breakeven prices, maximum gain and maximum loss", "Check a proposed structure before trading it"], "avoid": ["Showing value before expiry (that needs a pricing model and time/volatility assumptions; plot Black–Scholes value curves instead)", "Mixing strategies with very different scales on one shared y-axis"], "engine": "mpl", "real": false, "shapes": ["prices", "numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/option_payoff.png", "ipynb": "../10_finance_investment/option_payoff/option_payoff.ipynb", "py": "../10_finance_investment/option_payoff/option_payoff.py", "html": null}, {"slug": "volatility_smile_surface", "title": "Implied Volatility Smile & Surface", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Implied volatility (the σ that makes Black–Scholes match an option's market price) plotted across strikes for several expiries (the smile or skew), next to a strike × expiry heatmap of the whole surface. It shows how the market prices tail risk and how that changes with time.", "use": ["Show equity skew: downside puts priced at higher volatility than upside calls", "Compare smile steepness across expiries (short-dated skew is usually steeper)", "Quality-check a volatility surface before using it for pricing or risk"], "avoid": ["Audiences without options background (explain implied volatility first, or show a single ATM term structure)", "3-D surface plots for reports (hard to read exact values; occlusion); use lines plus a heatmap"], "engine": "mpl", "real": false, "shapes": ["numeric", "prices"], "alts": [], "level": "advanced", "animated": false, "thumb": "thumbs/volatility_smile_surface.png", "ipynb": "../10_finance_investment/volatility_smile_surface/volatility_smile_surface.ipynb", "py": "../10_finance_investment/volatility_smile_surface/volatility_smile_surface.py", "html": null}, {"slug": "football_field_valuation", "title": "Football Field (Valuation Summary)", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "Floating horizontal bars show the implied value-per-share range from each valuation method (trading range, analyst targets, comparable companies, precedent deals, DCF, LBO) against the current share price. It is the standard investment-banking summary of 'what is this company worth?'.", "use": ["Summarise several valuation approaches on one common scale (value per share or EV)", "Support M&A, fairness-opinion or equity-research discussions", "Show where a proposed offer price sits relative to each method"], "avoid": ["The ranges come from inconsistent assumptions (net debt, share count or date); reconcile first", "Only one method is available (show its sensitivity table instead)"], "engine": "mpl", "real": false, "shapes": ["categories", "uncertainty"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/football_field_valuation.png", "ipynb": "../10_finance_investment/football_field_valuation/football_field_valuation.ipynb", "py": "../10_finance_investment/football_field_valuation/football_field_valuation.py", "html": null}, {"slug": "dcf_sensitivity_table", "title": "DCF Sensitivity Table", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A two-way table of discounted-cash-flow value per share across discount rates (WACC) and terminal growth rates, colored relative to the current share price. It shows how much of a valuation depends on two assumptions that cannot be known precisely.", "use": ["Show how sensitive an intrinsic valuation is to its key inputs", "Find the assumptions the current market price implies (the cells closest to gray)", "Support investment memos, equity research and M&A models"], "avoid": ["Coloring by raw value with a rainbow scale; color relative to a meaningful reference (price) with a diverging scale", "More than ~9×9 cells (readers cannot scan it); choose sensible step sizes"], "engine": "mpl", "real": false, "shapes": ["numeric"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/dcf_sensitivity_table.png", "ipynb": "../10_finance_investment/dcf_sensitivity_table/dcf_sensitivity_table.ipynb", "py": "../10_finance_investment/dcf_sensitivity_table/dcf_sensitivity_table.py", "html": null}, {"slug": "income_statement_sankey", "title": "Income Statement Sankey", "family": "10_finance_investment", "familyName": "Finance & investment", "purpose": "A Sankey diagram that follows revenue from its segments through cost of revenue, operating expenses, interest and tax to net income. Band widths are proportional to dollars, so margins and the biggest cost lines read at a glance.", "use": ["Explain a company's profit and loss to non-accountants", "Show where each dollar of revenue goes and which costs dominate", "Compare segment contribution to total revenue"], "avoid": ["Comparing several companies or years precisely (use a margin table or stacked bars)", "Line items that do not sum (other income, one-offs); reconcile them or add an explicit node"], "engine": "plotly", "real": false, "shapes": ["flows", "hierarchy"], "alts": [], "level": "intermediate", "animated": false, "thumb": "thumbs/income_statement_sankey.png", "ipynb": "../10_finance_investment/income_statement_sankey/income_statement_sankey.ipynb", "py": "../10_finance_investment/income_statement_sankey/income_statement_sankey.py", "html": "../10_finance_investment/income_statement_sankey/income_statement_sankey.html"}, {"slug": "revenue_bridge", "title": "Revenue Bridge (Price / Volume / Mix / FX)", "family": "10_finance_investment", "familyName": "Finance & investment", "purp
