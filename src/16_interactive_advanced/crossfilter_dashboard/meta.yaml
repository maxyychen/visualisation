title: Crossfilter Dashboard (every view filters the others)
engine: altair
order: 70
level: advanced
data_shape: [categories, time]
purpose: >-
  Three coordinated views of one sales table: by region, by product and by month. Clicking a region
  or product, or brushing a range of months, filters the other two views, while gray bars keep the
  unfiltered totals for context. A headline states the filtered total and its share. Many-dimensional
  questions get answered without writing a single group-by.
when_to_use:
  - Exploratory analysis of a cube (region × product × time) by business users
  - Find which combination drives a change ("is the Q4 jump all Phones in the West?")
  - Replace a stack of pivot tables with one interactive page
avoid:
  - A one-message presentation (state the finding with one static chart)
  - More than four or five dimensions (the page becomes a puzzle; use a BI tool)
  - Readers on paper or static slides
alternatives:
  - Small multiples
  - Highlight table (region × product)
  - Stacked area by product
tips:
  - The PNG shows the default state (no filters); open the HTML to click and brush
  - Keep each view's own selection visible (full opacity) and fade its unselected bars, so readers see what is active
  - Draw the unfiltered totals in gray behind the filtered bars to preserve context
  - Use one color for "filtered amount" everywhere; identity is already given by position
example: >-
  Simulated monthly sales ($k) for four regions and five product lines over two years, with
  seasonality, growth and a strong November–December for Phones in the West.
read: >-
  Brush November–December on the timeline and the region and product bars shrink to the holiday
  share. Phones in the West stand out. Click West and the timeline shows its own seasonality
  against the gray total. The headline always gives the filtered sales and their share of the total.
