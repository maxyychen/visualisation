title: 2-D Partial Dependence Plot
engine: mpl
order: 110
level: advanced
data_shape: [model]
purpose: >-
  A heatmap of a model's average prediction over a grid of two features, holding everything
  else at its observed values, with each feature's 1-D partial dependence along the margins.
  If the two effects simply add up, every row of the heatmap is the same left-to-right pattern
  shifted up or down. When the pattern changes shape from row to row, the features interact.
when_to_use:
  - See how two features jointly drive a model's prediction
  - Check whether an interaction the model may have learned is real and large
  - Explain a nonlinear model (gradient boosting, random forest) to a technical audience
avoid:
  - The two features are strongly correlated (the grid includes combinations that never occur)
  - You need per-observation explanations (use ICE or SHAP dependence plots)
  - The audience is non-technical (a 1-D effect plot is easier)
alternatives:
  - 1-D partial dependence with ICE lines
  - SHAP dependence plot colored by the second feature
tips:
  - Overlay the observed data points or a rug so readers can see where the grid is extrapolating
  - Use one-hue sequential color with labelled contours
  - Keep the margins on the same color/value scale as the heatmap
example: >-
  A gradient-boosting model predicting one-year disease progression in the real diabetes dataset that
  ships with scikit-learn (load_diabetes, 442 patients; features are standardized). Here the dependence
  is on body-mass index and log serum triglycerides (s5). The grid covers the 2nd–98th percentile of
  each feature.
read: >-
  Predicted progression rises toward the top-right, from about 90 in the lower-left corner to about 245
  in the upper-right, so higher BMI and higher triglycerides both add risk. The two effects are similar
  in size: each margin spans roughly 85 points. The blocky contours come from the boosted trees' step
  functions. They form L-shapes rather than tilting or twisting, so the two effects are mostly additive
  with little interaction (an additive fit explains over 99% of the grid's variation). Gray dots are the
  real patients; sparse corners are extrapolation.
