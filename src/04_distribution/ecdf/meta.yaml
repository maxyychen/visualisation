title: Empirical CDF (ECDF)
engine: mpl
level: intermediate
order: 80
purpose: For every value x, plots the fraction of observations ≤ x. It has no bins or smoothing, and it
  answers percentile questions directly ('what share of users wait under 2 s?').
when_to_use:
- Compare distributions precisely, with no binning choices
- Read percentiles and thresholds (SLAs, latency, dose response)
- Overlay several groups without the clutter of overlapping histograms
avoid:
- The audience is unfamiliar with cumulative plots (shape is less intuitive than a histogram)
alternatives:
- Histogram
- KDE density
- Box plot
tips:
- Add reference lines at key percentiles (median, p95)
example: Page-load latency for two server versions, 3,000 requests each, with p50 and p95 marked.
read: 'Read across from p95 to each curve, then down: 95% of v2 requests finish faster than the v1 p95.
  A curve further left is better at every percentile.'
data_shape: [numeric]
