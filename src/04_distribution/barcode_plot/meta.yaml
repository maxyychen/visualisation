title: Barcode Plot (Rug Plot)
engine: mpl
level: intermediate
order: 110
purpose: Draws each observation as a thin vertical tick on a line. It is a minimal, high-resolution distribution
  display that also works well for placing one item among the rest.
when_to_use:
- Show exactly where individual values fall, for example to highlight one country among all of them
- Show a compact distribution strip for dashboards and tables
- Add a margin to a density or scatter plot
avoid:
- There are many duplicate or close values (ticks overlap and hide counts)
- The audience needs the shape (add a density curve)
alternatives:
- Dot strip plot
- Histogram
- Beeswarm
tips:
- Use thin, semi-transparent ticks so clusters read darker than gaps
- Make the highlighted item thicker and coloured, and keep everything else gray
- Put one strip per date or group on a shared x-axis so positions can be compared
example: Unemployment rate of 50 US-like states on three dates, highlighting one state (simulated).
read: Each gray tick is one state, and the orange tick is S07. In April 2020 every state jumped and the
  spread widened from about 2–5% to about 6–18%. S07 went from below the median (2.7%) to the 9th-highest
  rate (15.8%), then returned to the middle of the pack (3.9%) by January 2022.
data_shape: [numeric]
