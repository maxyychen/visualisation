title: Beeswarm Plot
engine: mpl
level: intermediate
order: 60
purpose: Places each point along the value axis and nudges overlapping points sideways without overlap,
  so the swarm's outline traces the distribution. Every point stays visible, unlike random jitter.
when_to_use:
- Show individual observations and the distribution shape together
- Show small to moderate datasets (up to a few hundred per group)
- Highlight specific items (color by an attribute)
avoid:
- There are thousands of points (the swarm overflows its lane)
alternatives:
- Strip plot
- Violin plot
- Dot strip plot
tips:
- Keep the marker size small enough that the widest group still fits its lane
- Use colour for one binary attribute at most; more hues make the swarm noisy
- Add a median line per group if the comparison of centres matters
example: Salaries of 248 data scientists by seniority (synthetic), colored by remote vs. on-site.
read: Each dot is one person. Median salary climbs from about $70k (Junior) to about $150k (Lead), and
  the spread widens with seniority. Remote and on-site dots are mixed throughout each swarm, so in this
  example working remotely does not change pay.
data_shape: [numeric, categories]
