title: Beeswarm Plot
engine: mpl
level: intermediate
order: 60
purpose: Places each point along the value axis and nudges overlapping points sideways without overlap,
  so the swarm's outline traces the distribution. Every point stays visible, unlike random jitter.
when_to_use:
- Show individual observations and the distribution shape together
- Show small to moderate datasets (up to a few hundred per group)
- Highlight specific items (color by an attribute)
avoid:
- There are thousands of points (the swarm overflows its lane)
alternatives:
- Strip plot
- Violin plot
- Dot strip plot
example: Salaries of 250 data scientists by seniority (synthetic), colored by remote vs. on-site.
data_shape: [numeric, categories]
