title: Population Pyramid
engine: mpl
level: basic
order: 90
purpose: Back-to-back horizontal histograms of age bands, with males on one side and females on the other.
  A population's age structure (growing, stable or ageing) shows at a glance.
when_to_use:
- Show the age and sex structure of a population
- Compare two groups across the same ordered bins
avoid:
- The bins are not ordered
- Comparing many populations (use small multiples or overlay outlines)
alternatives:
- Spine chart
- Overlaid outline pyramids for two years
tips:
- Use the same scale on both sides and label the ticks with absolute values
- Use percent of total rather than counts when comparing populations of different size
- Keep the bands in age order with the youngest at the bottom
example: Age structure of a fictional ageing population (percent of total), in 5-year bands.
read: Each row is an age band, with males to the left and females to the right. The bulge in middle age
  and narrow base point to an ageing population with low birth rates. Women outnumber men from the late teens on, and the gap widens
  with age.
data_shape: [categories, numeric]
