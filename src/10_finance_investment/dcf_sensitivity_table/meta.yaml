title: DCF Sensitivity Table
engine: mpl
level: intermediate
order: 290
purpose: A two-way table of discounted-cash-flow value per share across discount rates (WACC) and terminal
  growth rates, colored relative to the current share price. It shows how much of a valuation depends
  on two assumptions that cannot be known precisely.
when_to_use:
- Show how sensitive an intrinsic valuation is to its key inputs
- Find the assumptions the current market price implies (the cells closest to gray)
- Support investment memos, equity research and M&A models
avoid:
- Coloring by raw value with a rainbow scale; color relative to a meaningful reference (price) with a
  diverging scale
- More than ~9×9 cells (readers cannot scan it); choose sensible step sizes
alternatives:
- Tornado chart of one-at-a-time sensitivities
- Football field across methods
tips:
- Outline the base case cell
- Center the diverging scale on the current price so blue = upside and orange = downside
- Print values in every cell; this is a table first and a chart second
- Keep WACC above terminal growth everywhere (the Gordon growth formula breaks otherwise)
example: Five-year free-cash-flow forecast ($600m→$780m), $1.8bn net debt, 250M shares and a $38.50 share
  price; terminal value by the Gordon growth formula (illustrative).
read: Each cell is value per share for one WACC (column) and terminal growth (row), with the % up- or
  downside to $38.50 below it. The base case (8.5%, 2.0%) is outlined at $36.2, 6% below the price.
  Moving one column right (WACC +0.5 pp) lowers value by about $3, about as much as moving one row
  up (growth −0.5 pp), so both terminal-value assumptions matter as much as the forecast itself.
data_shape:
- numeric
