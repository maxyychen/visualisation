title: PCA Biplot
engine: mpl
level: intermediate
order: 10
purpose: >-
  Projects many correlated numeric variables onto the first two principal components. It draws the
  observations as points and the original variables as arrows (loadings), so you see at once how the
  samples group and which variables drive that grouping.
when_to_use:
  - Get an overview of a dataset with many numeric variables (5–50)
  - See which variables pull observations apart, and which variables are correlated (arrows pointing the same way)
  - Check visually whether known groups separate in the main directions of variation
avoid:
  - The first two components explain little of the variance (check the axis labels; under ~40% the picture is misleading)
  - Variables are on different scales and you have not standardized them
  - The audience is non-technical (principal components have no plain-language units)
alternatives:
  - t-SNE / UMAP embedding (for non-linear structure)
  - Pair plot (for fewer than ~6 variables)
  - Correlation heatmap
tips:
  - Always standardize variables first, unless they share a unit
  - Put the % of variance explained on each axis label
  - Label only the longest arrows; a hedgehog of 30 labeled arrows is unreadable
example: >-
  The real UCI Wine dataset bundled with scikit-learn (load_wine). It has 178 wines from three Italian
  cultivars and 13 chemical measurements.
read: >-
  Each dot is a wine. The three cultivars form three distinct clouds. Arrows point towards wines with
  high values of that variable. Flavanoids and total phenols point towards cultivar 0, so those wines
  are rich in phenolics. Color intensity points towards cultivar 2, and cultivar 1 sits opposite
  alcohol and proline, meaning lighter, less alcoholic wines. (The sign of a principal component is
  arbitrary, so another tool may show the picture mirrored.)
data_shape: [numeric]
