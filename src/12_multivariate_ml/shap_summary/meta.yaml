title: SHAP Summary (Beeswarm)
engine: mpl
level: advanced
order: 30
purpose: >-
  One row per feature, one dot per prediction. A dot's horizontal position is how much that feature
  pushed that prediction up or down, and its color is the feature's value. The chart shows which
  features matter, in which direction, and for whom.
when_to_use:
  - Explain a predictive model globally while keeping per-patient detail
  - Show whether high values of a feature raise or lower the prediction
  - Spot features whose effect is large for a few cases but small on average
avoid:
  - Readers will take contributions as causal effects (they explain the model, not the world)
  - Features are strongly correlated (attributions get split arbitrarily between them)
  - You need a single explanation for one patient (use a waterfall/force plot)
alternatives:
  - Permutation importance (global ranking only)
  - Partial dependence / ICE plot (shape of one feature's effect)
tips:
  - Sort features by mean |contribution| and show the top 10–15
  - Draw a zero line; the side of zero tells the direction
  - For tree models use the shap package (TreeExplainer); this example avoids the dependency
example: >-
  A logistic regression predicting malignancy in the real Breast Cancer Wisconsin dataset
  (load_breast_cancer). For a linear model with independent features, the exact SHAP value of feature j
  is coef_j × (x_j − mean_j) on the log-odds scale. This example computes those values directly,
  without the shap package.
read: >-
  "Worst texture" is the most influential feature. Light dots (low texture) sit left of zero and
  dark dots (high texture) sit right, so rougher texture pushes predictions towards malignant. A wide
  spread means the feature matters a lot for some tumours and little for others.
data_shape: [model]
