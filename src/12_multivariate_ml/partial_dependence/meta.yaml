title: Partial Dependence & ICE Plot
engine: mpl
level: intermediate
order: 40
purpose: >-
  Shows how a model's prediction changes as one feature varies while the others stay at their observed
  values. Thin ICE lines trace individual cases and the bold line is their average (partial dependence),
  which exposes the shape of a feature's effect: linear, threshold, plateau or interaction.
when_to_use:
  - Explain the shape of a feature's effect in a black-box model (gradient boosting, random forest)
  - Check for thresholds or saturation that a linear model would miss
  - Spot interactions (ICE lines that are not parallel)
avoid:
  - The feature is strongly correlated with others (the model gets evaluated on impossible combinations)
  - You need effects for more than ~2 features at once
alternatives:
  - SHAP dependence plot
  - Accumulated local effects (ALE) plot, which copes better with correlated features
tips:
  - Add a rug of the observed values so readers see where data is thin
  - Center the ICE lines (subtract each line's starting value) if levels vary a lot
  - Keep ICE lines thin and gray, and the average line bold
example: >-
  A gradient-boosting model of disease progression one year after baseline, fitted to the real Diabetes
  dataset bundled with scikit-learn (load_diabetes, 442 patients, standardized features). The panels
  show BMI and the serum triglycerides measure (s5).
read: >-
  Predicted progression stays flat across low BMI and then rises steeply above average BMI, which is a
  threshold rather than a straight line. Triglycerides (s5) behave similarly. Gray lines are individual
  patients. Because they run roughly parallel, the effect is similar across patients.
data_shape: [model]
