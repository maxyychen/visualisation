title: Learning Curve
engine: mpl
level: intermediate
order: 60
purpose: >-
  Plots training and cross-validated performance against the number of training examples. The gap
  and the trend tell you whether a model is underfitting, overfitting, or would benefit from more data.
when_to_use:
  - Decide whether collecting more data is likely to improve a model
  - Diagnose overfitting (large train–validation gap) or underfitting (both scores low)
  - Compare how quickly candidate models learn from limited data
avoid:
  - The dataset is tiny (cross-validation scores will be too noisy to compare)
  - You want to compare models at one fixed data size (a table or dot plot is clearer)
alternatives:
  - Validation curve (score vs a hyperparameter)
  - Dot plot of cross-validation scores per model
tips:
  - Show the spread across folds as a band, not just the mean
  - Use the same y-axis across panels so models can be compared
  - Put the metric name and direction ("higher is better") on the axis
example: >-
  Two classifiers on the real Breast Cancer Wisconsin dataset (load_breast_cancer, 569 tumours), with
  accuracy from 5-fold cross-validation: a regularized logistic regression and an unpruned decision tree.
read: >-
  For the logistic regression (left) the two curves converge near 98%, so more data would help little.
  The decision tree (right) scores 100% on its training data while validation stays lower, a persistent
  gap that signals overfitting.
data_shape: [model]
