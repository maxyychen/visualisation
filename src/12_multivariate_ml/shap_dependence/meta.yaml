title: SHAP Dependence Plot
engine: mpl
order: 900
level: advanced
data_shape: [model]
purpose: >-
  One dot per prediction. The x-axis is a feature's value and the y-axis is how much that value
  pushed the prediction up or down (its SHAP contribution). Color is a second feature. The shape
  of the cloud shows the effect, and a color split that fans out shows an interaction: the effect of
  one feature depends on another.
when_to_use:
  - Show the shape of one feature's effect in a model (linear, threshold, saturating)
  - Detect and explain interactions, e.g. utilization hurts more when income is low
  - Follow up on a SHAP summary plot for the top features
avoid:
  - Readers will interpret contributions as causal effects (they describe the model, not the world)
  - Features are strongly correlated (attributions get split arbitrarily between them)
  - Only the overall importance ranking is needed (use permutation importance or a SHAP summary)
alternatives:
  - Partial dependence / ICE plot
  - 2-D partial dependence plot
  - SHAP summary (beeswarm)
tips:
  - Choose the color feature that best explains vertical spread (shap's `approximate_interactions` does this)
  - Add a zero line and the feature's distribution as a rug or histogram
  - For tree models use the shap package (TreeExplainer); this example computes exact values in closed form
example: >-
  A simulated credit-default model: logistic regression on credit utilization, income and debt-to-income,
  plus a utilization × income interaction term. For this model the exact interventional SHAP values have a
  closed form. For a main effect, φ_j = b_j(x_j − μ_j). For the product term b·x₁x₂, each of the two
  features receives ½·b·(x_k − μ_k)(x_other + μ_other). No shap package is needed.
read: >-
  Left: higher utilization raises default risk (contribution rises left to right), but the dots fan out
  by color. For low-income borrowers (light) the slope is steep, for high-income borrowers (dark) it is
  shallow, which is the interaction. Right: debt-to-income has a plain linear effect, with no color
  pattern, so it does not interact with income.
