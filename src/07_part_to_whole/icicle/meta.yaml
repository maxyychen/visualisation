title: Icicle Chart
engine: plotly
level: intermediate
order: 70
purpose: A rectangular, linear version of the sunburst. Each hierarchy level is a row (or column), and
  each child sits directly under its parent with a width proportional to its value. Straight edges are
  easier to compare than arcs, and long labels fit better.
when_to_use:
- Show hierarchical part-to-whole where labels are long
- Show file-system sizes, cost breakdowns, or org structures
- Need accurate comparison at every level of a hierarchy
avoid:
- The hierarchy has only one level (use a bar or treemap)
- There are hundreds of leaves (use a treemap)
alternatives:
- Sunburst
- Treemap
- Flame graph (performance profiling)
tips:
- Show values (or shares) in the labels, since the widths alone are hard to read for small children
- Color by the top-level branch and let children inherit a lighter shade
- Sort children by size so the largest sit at the start of each parent
example: Disk usage of a project folder by directory and file type (illustrative sizes).
read: The top row is the whole project (about 2,000 MB); each row below splits its parent, with width
  proportional to size. The data folder takes over half the space, mostly raw files (820 MB), and models
  take a third, while src and docs are slivers.
data_shape: [hierarchy]
