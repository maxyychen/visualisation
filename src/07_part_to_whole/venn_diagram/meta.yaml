title: Venn Diagram
engine: mpl
level: basic
order: 110
purpose: Overlapping circles that show how two or three sets share members. Each region is labeled with
  its count, so readers see the size of every combination, including what is unique and what is shared.
when_to_use:
- Show overlap between 2–3 groups (customers holding products A, B, C)
- Compare gene lists, customer segments, or feature sets
avoid:
- There are more than 3 sets (use an UpSet plot)
- Exact area proportionality is expected (it is only approximate for 3 sets)
alternatives:
- UpSet plot
- Euler diagram
- Grouped bar of intersections
example: 'Product holdings of 1,000 retail-bank customers (simulated): checking account, credit card, brokerage account.'
read: Each region's number counts the customers with exactly that combination of products. The center
  shows the 40 customers who hold all three, the bank's most cross-sold segment. The seven regions add up to 720; the other 280 customers hold none of
  the three and fall outside the circles.
data_shape: [sets]
tips:
- Keep to two or three sets; beyond that, region shapes become unreadable, so use an UpSet plot
- Print the count in every region, because circle overlaps are only approximately area-proportional
- State the total and how many items belong to none of the sets, which a Venn diagram cannot show
