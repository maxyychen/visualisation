title: Streamgraph
engine: mpl
level: intermediate
order: 60
purpose: A stacked area chart laid out around a central, wiggling baseline instead of zero. It gives an
  organic, flowing picture of how many categories rise and fall over time.
when_to_use:
- Show the ebb and flow of many categories over time (music genres, topics, species)
- Engaging, editorial graphics where overall patterns matter more than exact values
avoid:
- Precise values or totals must be read (there is no fixed baseline)
- Analytical or dashboard contexts
- There are few time points
alternatives:
- Stacked area chart
- Small multiples
- Heatmap
tips:
- Smooth the series lightly; jagged inputs make the bands hard to follow
- Order layers so the most variable ones sit on the outside, away from the centre
- Label bands directly where they are thickest when space allows
example: Weekly listening volume of six music genres across a year (synthetic).
read: Band thickness at any week is that genre's listening volume. The vertical position has no meaning.
data_shape: [time, categories]
