title: Seasonal (Cycle) Plot
engine: mpl
level: intermediate
order: 130
purpose: Overlays each year as its own line on a shared month axis, or groups values by season. Seasonal
  patterns can be compared year against year, which a long continuous line hides.
when_to_use:
- Data has a strong seasonal cycle (retail, energy demand, flu cases, tourism)
- Ask whether this year's season is unusual compared with past years
avoid:
- There is no repeating cycle
- Many years would overlap into an unreadable bundle (highlight the latest year)
alternatives:
- Line chart
- Calendar heatmap
- Small multiples by year
tips:
- Gray out past years and color the current year
example: Monthly electricity demand for six years, highlighting the most recent year.
data_shape: [time]
