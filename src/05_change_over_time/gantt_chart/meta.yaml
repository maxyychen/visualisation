title: Gantt Chart
engine: mpl
level: basic
order: 110
purpose: 'Horizontal bars placed on a time axis, one per task, showing start, duration and end. It is
  the standard view of a schedule: sequence, overlap and progress.'
when_to_use:
- Plan or communicate project schedules, phases and milestones
- Show overlapping activities and their timing
- Track progress against plan
avoid:
- Complex dependency networks are the main concern (use a network/PERT diagram)
- There are hundreds of tasks (group into phases)
alternatives:
- Event timeline
- Swimmer plot (clinical)
tips:
- Color by phase or owner, not by task
- Mark 'today' with a vertical line
- Shade completed portions to show progress
example: A 4-month software project with tasks in three phases (illustrative).
read: Each bar is a task from start to planned end, and the solid part is the share completed. At the
  red 'today' line, Backend API was due a week ago but is only 80% done, and Data migration is 30% done
  with two-thirds of its time gone, so the testing phase is at risk of slipping.
data_shape: [time, categories]
