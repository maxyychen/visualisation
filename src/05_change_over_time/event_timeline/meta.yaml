title: Event Timeline
engine: mpl
level: basic
order: 150
purpose: Places labelled events along a time axis, with stems alternating above and below so labels don't
  collide. It shows chronology, gaps and the density of events at a glance.
when_to_use:
- Tell a historical narrative or company milestones
- Show when discrete events happened relative to each other
- Annotate the context behind changes seen in another chart
avoid:
- The events have quantitative values to compare (use a chart with a value axis)
- There are dozens of events that would cram together (filter to key ones)
alternatives:
- Gantt chart (events with duration)
- Annotated line chart
tips:
- Alternate stem heights (and above/below) so neighbouring labels do not collide
- Keep labels to two or three words and put the year next to each one
- Use a real date axis so uneven gaps between events stay visible
example: Key milestones in the history of Python data visualization (dates approximate).
read: Each dot is one milestone on a true time scale. After matplotlib (2003) and the NumPy/pandas
  foundations, there is a four-year gap, then a burst of new libraries between 2012 and 2016 as
  interactive and declarative tools arrived.
data_shape: [time]
