title: OncoPrint (Mutation Matrix)
engine: mpl
level: advanced
order: 70
purpose: A genes × samples grid in which each cell's glyph shows the type of alteration (mutation, amplification,
  deletion) a tumour carries in that gene. Samples are sorted so patterns of co-occurrence and mutual exclusivity
  stand out, and marginal bars give alteration frequencies.
when_to_use:
- Summarise the genomic landscape of a tumour cohort for a set of driver genes
- Show mutual exclusivity or co-occurrence of alterations across patients
- Show the alteration type and the alteration frequency in one figure
avoid:
- There are hundreds of genes (filter to recurrently altered or pathway genes)
- There are thousands of samples, so glyphs shrink below a pixel (aggregate or use frequency bars alone)
alternatives:
- Stacked bar of alteration frequency per gene
- UpSet plot (exact co-occurrence counts)
- Heatmap of variant allele frequency
tips:
- Sort genes by alteration frequency and samples by a "memo sort" so blocks of alterations line up
- Keep the gray background cell so unaltered and missing are distinguishable
- Use full-height glyphs for copy-number changes and narrow inner bars for mutations, so both can coexist in one cell
example: 10 cancer genes across 60 synthetic tumour samples with missense, truncating, amplification and deep-deletion
  events. KRAS and EGFR are simulated as mutually exclusive.
read: Each column is one tumour and each row one gene. TP53 is altered in about half of the samples. KRAS and EGFR
  alterations almost never fall in the same column, which suggests mutual exclusivity. The right bars give each
  gene's alteration rate and the top bars give each tumour's total number of alterations.
data_shape: [categories, sets]
