title: Swimmer Plot
engine: mpl
order: 90
purpose: One horizontal bar per patient shows time on treatment, with markers for key events (response
  onset, progression, ongoing therapy). It tells each patient's story, which summary curves hide.
when_to_use:
- Show individual treatment duration and response in early-phase oncology trials
- Show durability of response alongside time to response
- Show any per-entity timeline with events (customer lifecycles, equipment maintenance)
avoid:
- There are more than about 50 patients (bars become unreadable; use Kaplan–Meier curves)
- Only aggregate statistics matter
alternatives:
- Kaplan–Meier curve
- Gantt chart
- Event-chart / lasagna plot
tips:
- Sort bars by duration, and color by best overall response
- Use distinct marker shapes for events and an arrow for 'still on treatment'
example: 'Synthetic phase I cohort of 24 patients: months on treatment, best response, and event markers.'
read: Each bar is one patient's time on treatment, colored by best response. Triangles mark when a response
  began, crosses mark progression, and arrows mean the patient is still on treatment.
data_shape: [events, time]
