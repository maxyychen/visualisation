title: Tumour Response Waterfall Plot
engine: mpl
order: 100
purpose: One vertical bar per patient shows the best percentage change in tumour size from baseline, sorted
  from worst to best. Response categories (RECIST) can be read straight off the threshold lines.
when_to_use:
- Show tumour shrinkage in single-arm or early-phase oncology trials
- Show any per-subject percent change where thresholds define categories
avoid:
- Time course or durability matters (pair it with a swimmer or spider plot)
- Comparing arms of very different sizes in one panel (use one panel per arm)
alternatives:
- Spider plot (change over time per patient)
- Swimmer plot
- Diverging bar chart
tips:
- Draw RECIST reference lines at +20% (progression) and −30% (partial response)
- Color bars by best overall response with an ordered palette, and keep the bar gaps small
example: Best % change in the sum of target-lesion diameters for 40 synthetic patients.
read: Each bar is a patient. Bars below −30% are responders and bars above +20% progressed. The longer
  the blue section, the more active the drug.
data_shape: [categories, numeric]
