title: Forest Plot
engine: mpl
order: 20
purpose: Shows effect estimates (hazard ratio, odds ratio, mean difference) with confidence intervals
  for many subgroups or studies, aligned against a line of no effect. It is the core figure of meta-analyses
  and trial subgroup analyses.
when_to_use:
- Show a meta-analysis that pools results from several studies
- Check the consistency of a treatment effect across pre-specified subgroups
- Present regression coefficients or odds ratios with their CIs
avoid:
- There are only one or two estimates (state them in text)
- Estimates are on different scales (normalize first)
alternatives:
- Coefficient (dot-and-whisker) plot
- Table of estimates
tips:
- Plot ratios on a log scale so that 0.5 and 2 are equidistant from 1
- Size the squares by weight or sample size, and show the pooled estimate as a diamond
- Print the numeric estimate and CI in a column beside the plot
example: Hazard ratios (new treatment vs. control) for overall survival across patient subgroups (synthetic).
read: Each square is a subgroup's hazard ratio, and its line is the 95% CI. Squares left of 1 favour the
  new treatment. A CI that crosses 1 is not statistically significant. The diamond is the overall estimate.
data_shape: [uncertainty, categories]
