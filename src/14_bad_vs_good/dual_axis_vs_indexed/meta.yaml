title: "Dual Axis vs. Indexed Line"
engine: mpl
order: 10
purpose: >-
  A dual-axis chart plots two measures with different units against two independent y-scales.
  Because the designer picks both scales, where the lines cross, how steep they look, and whether they
  seem to move together are all arbitrary. The chart can invent a correlation, or hide one.
when_to_use:
  - Use an indexed line chart (each series = 100 at a common start) to compare the growth of measures with different units
  - Use two stacked charts with a shared x-axis when the absolute levels matter
avoid:
  - Two measures with different units or scales that you want to show "together"
  - Revenue vs. users, price vs. volume, cases vs. tests
alternatives:
  - Indexed line chart (rebased to 100)
  - Two aligned panels sharing the x-axis (small multiples)
  - Connected scatter plot (one measure on each axis)
tips:
  - Rebase each series to 100 at a meaningful start date and label the axis "Index (start = 100)"
  - Label line ends directly instead of using a legend
  - If absolute values matter, put them in the tooltip, table or subtitle
example: Monthly active users (thousands) and revenue ($M) of an app over three years.
read: >-
  On the left, revenue starts below users, shoots past them in 2023 and ends far above, which looks like revenue grew much
  faster. Both the crossing and the slopes come only from the two chosen axis ranges. On the right, both series
  start at 100: users actually grew about 3× and revenue only about 1.7×, which is the opposite story.
data_shape: [time]
