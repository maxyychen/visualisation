title: Ordered Proportional Symbol Chart
engine: mpl
level: basic
order: 80
purpose: Circles sized by value and arranged in rank order. It suits values that span a very wide range,
  where bars for the small items would be too short to see.
when_to_use:
- Rank items whose values differ by orders of magnitude (company valuations, city populations)
- Make an eye-catching infographic where visual impact matters more than precision
avoid:
- Precise comparison is needed (people underestimate area differences)
- Values are similar (the circles all look the same)
alternatives:
- Ordered bar chart with a log axis
- Packed bubble chart
tips:
- Scale circle area (not radius) to value
- Print the value inside or below each circle
example: Market value ($bn) of the 10 largest companies in a fictional stock index; values span two
  orders of magnitude.
read: Circle area is market value, ranked from largest (left) to smallest. Novacorp ($2,900bn) is almost
  100 times Zephyr ($30bn); on a linear bar chart the last few companies would be barely visible slivers.
data_shape: [categories, numeric]
