title: Ordered Column Chart
engine: mpl
level: basic
order: 20
purpose: Vertical bars sorted by value. It works like the ordered bar chart, but suits short labels and
  layouts that are wider than they are tall.
when_to_use:
- Rank a handful of categories with short names
- Fit a ranking into a wide slide or dashboard slot
avoid:
- Labels are long (they must be rotated, so use horizontal bars)
- The categories are time periods (keep them in time order instead of sorting by value)
alternatives:
- Ordered bar chart
- Lollipop chart
tips:
- Sort from largest on the left to smallest on the right
- Always start the y-axis at zero; bar length is the value
- Label values on top of the bars when there are few of them
example: Number of medals won by the top 10 teams at a fictional games.
read: Teams are sorted from most medals (left) to fewest. The USA (113) and China (91) are far ahead; the
  rest form a closer pack from 65 down to 32.
data_shape: [categories, numeric]
