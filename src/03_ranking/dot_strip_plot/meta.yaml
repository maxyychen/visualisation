title: Dot Strip Plot (rank position)
engine: mpl
level: intermediate
order: 50
purpose: Places every item as a dot along a single value axis, one strip per group, with the item of interest
  highlighted. It shows where one entity ranks within each of several measures.
when_to_use:
- Show where one item (your city, your product) ranks across several metrics
- Show a ranking where the spread of the whole field matters too
avoid:
- There are no items worth highlighting (a box plot summarises spread better)
- There are thousands of items per strip (dots merge)
alternatives:
- Beeswarm plot
- Small-multiple ordered bars
tips:
- Make every score point the same way (higher = better), renaming metrics such as cost to affordability
- Gray the field and give the highlighted item one strong color plus a direct rank label
- Use jitter or transparency when many dots share similar values
example: Scores of 30 cities on five liveability measures (simulated); 'Our city' is highlighted. Higher
  scores are better on every measure.
read: Each gray dot is another city and the blue dot is ours, labelled with its rank out of 30. Our best
  results are transit (#4) and safety (#6); we sit near the bottom on affordability (#28).
data_shape: [categories, numeric]
