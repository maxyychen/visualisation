title: Deviation Lollipop (from mean)
engine: mpl
level: basic
order: 40
purpose: Each item is a dot joined by a thin stem to a reference value such as the group mean. It carries
  the same message as a diverging bar with much less ink, so it works well with many items.
when_to_use:
- Show how far each item sits from the average or target
- Show many categories, where solid bars would look heavy
- Highlight outliers relative to a benchmark
avoid:
- Values are very close together (stems become invisible)
- The audience expects conventional bar charts
alternatives:
- Diverging bar chart
- Dot plot with a reference line
tips:
- Sort items by deviation so the crossover from below to above average is easy to find
- State the reference value (here the fleet mean) in the axis label
- Use two opposite hues for above and below, and keep stems thin so the dots carry the value
example: Fuel efficiency (mpg) of 20 car models compared with the fleet average, simulated data.
read: Blue dots are models more efficient than the fleet average of 29.2 mpg and orange dots are less
  efficient. Nine models beat the average. Model 10 stands out, about 12 mpg below it.
data_shape: [categories, numeric]
