title: Choropleth Map (US states)
engine: plotly
level: basic
order: 20
purpose: A choropleth at the sub-national level, using built-in US state shapes keyed by two-letter postal
  codes. It works for any state-level KPI.
when_to_use:
- Show a state-level rate or index for a US audience
- Show regional patterns (South vs. Northeast, coastal vs. interior)
avoid:
- Small states such as RI, DE and DC matter to the story (they are nearly invisible; use a tile grid map)
- Values are totals that scale with population
alternatives:
- Tile grid map
- Sorted bar chart
tips:
- Use `locationmode='USA-states'` with postal codes, so no shapefile is needed
- State the data year and the denominator in the title or legend
- Viewing requires a network connection (plotly.js loads the map shapes)
example: Illustrative (synthetic) uninsured rate (%) by state, with a South-to-North gradient.
read: Darker blue means a higher uninsured rate. The southern band (OK, NC, FL, SC, GA, all above 12%)
  is darkest, while California, Pennsylvania and much of the North are pale. Tiny RI, DE and DC are hard
  to see at all, which is why the tile grid map exists.
data_shape: [geo]
