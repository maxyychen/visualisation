title: Correlation Matrix Heatmap
engine: mpl
level: intermediate
order: 50
purpose: A grid that colors each cell by the correlation coefficient between a pair of variables. Strong
  positive and negative relationships across many variables stand out in one view.
when_to_use:
- Screen many numeric variables for pairwise relationships
- Spot multicollinearity before regression modelling
- Summarise a feature set in a report
avoid:
- Relationships are non-linear (Pearson r can miss them; check scatter plots)
- There are more than ~25 variables (cluster or filter first)
alternatives:
- Pair plot
- Clustered heatmap with dendrogram
tips:
- Use a diverging palette centred at 0 with a neutral midpoint
- Show only the lower triangle to remove redundancy
- Annotate the coefficients when there are few variables
example: Correlations between the monthly returns of eight asset classes over 15 years (synthetic, factor-model data).
read: Red cells are positive correlations and blue cells negative; darker means stronger. Equity markets
  move together, and REITs and high yield lean towards stocks. Treasuries are mildly negatively correlated with
  equities (about -0.2), which is why they diversify a stock portfolio; gold is roughly uncorrelated with
  everything except commodities.
real_data:
  source: "plotly.express.data.stocks() \u2014 weekly prices of six large US tech stocks, 2018\u20132019, bundled with plotly"
  offline: true
data_shape: [numeric, prices]
