title: Scatter with Regression Line
engine: mpl
level: intermediate
order: 20
purpose: A scatter plot with a fitted trend line and its confidence band. The fit summarises the relationship,
  the band shows how certain the estimate is, and the raw points stay visible as evidence.
when_to_use:
- Show the direction and strength of a roughly linear relationship
- Report a correlation coefficient or slope alongside the data
- Show model fit and the uncertainty around it
avoid:
- The relationship is clearly non-linear (use LOWESS or a polynomial fit)
- Readers might read the trend line as proof of causation
- Outliers dominate the fit (check robust alternatives first)
alternatives:
- LOWESS-smoothed scatter
- Joint plot
- Residual plot
tips:
- Annotate r (or R²) and n in a corner
- Make the band lighter than the line and the points lighter than both
example: Weekly advertising spend vs. sales for 80 weeks, with an OLS fit and 95% confidence band.
read: The orange line is the best linear fit and the shaded band is its 95% confidence interval. The band
  is narrowest near the mean spend, where the data is densest.
real_data:
  source: "plotly.express.data.tips() \u2014 244 restaurant bills and tips (Bryant & Smith 1995), bundled with plotly"
  offline: true
data_shape: [numeric]
