title: Nomogram
engine: mpl
level: advanced
order: 170
purpose: A graphical calculator for a regression model. Each predictor has its own scale; you read off points for
  a patient's values, add them up, and convert the total to a predicted probability on the bottom scale. It makes a
  model usable at the bedside without software.
when_to_use:
- Turn a logistic or Cox model into a tool clinicians can use by hand
- Show the relative weight each predictor carries in the model (length of each scale)
- Publish a prognostic model alongside its coefficients
avoid:
- The model has many interactions or non-linear terms that make the scales confusing
- An online calculator or EHR integration is available (it is less error-prone)
- The model is not validated (a nomogram makes an unvalidated model look authoritative)
alternatives:
- Online risk calculator
- Forest plot of coefficients (to explain the model, not to use it)
- Points-based risk score table
tips:
- Scale the predictor with the largest effect range to 0–100 points
- Walk through one example patient on the chart so readers learn how to use it
- State the model's validation performance (C-index and calibration) in the caption
example: A logistic model for 5-year recurrence fitted on 1,500 synthetic patients using age, tumour size, number of
  positive lymph nodes and histological grade. An example patient is traced in orange.
read: The example patient (orange dots) scores points on each predictor scale. The points add up to the total marked
  on the "Total points" scale, which lines up with their predicted recurrence risk below it. The longest scale (lymph
  nodes) is the strongest predictor.
data_shape: [model]
