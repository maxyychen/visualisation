title: Column Chart (vertical bar)
engine: mpl
level: basic
order: 10
purpose: Vertical bars whose heights encode values on a common zero baseline. Aligned length is the most
  accurately read visual encoding, which makes this the default for comparing amounts.
when_to_use:
- Compare values across a small number (≤ 12) of categories with short labels
- Show counts or amounts per time period (months, quarters)
avoid:
- Category labels are long (use horizontal bars)
- The baseline is not zero (bar length would lie)
- The data is a continuous trend with many points (use a line)
alternatives:
- Horizontal bar chart
- Dot plot
- Lollipop chart
tips:
- Always start the y-axis at zero
- One series means one color. Highlight a single bar only if it is the story
- Gaps between bars ~30–50% of the bar width
example: Quarterly revenue for two years (illustrative data), highlighting the latest quarter.
read: Each bar is one quarter's revenue, all measured from zero. Revenue climbs through each year and
  peaks in Q4 both times ($6.3M, then $7.4M); the highlighted Q4 2024 is the highest of all eight quarters.
data_shape: [categories, numeric]
