title: Confusion Matrix
engine: mpl
level: intermediate
order: 40
purpose: A grid of actual versus predicted classes. The diagonal holds correct predictions, and every
  off-diagonal cell shows a specific kind of mistake.
when_to_use:
- Show which classes a classifier confuses with each other
- Report sensitivity and specificity per class for a diagnostic test
- Show agreement between two raters or two methods on categorical labels
avoid:
- There are dozens of classes (aggregate, or show only the top confusions)
- You need threshold-free performance (use ROC or PR curves)
alternatives:
- Per-class precision/recall bar chart
- Sankey from actual to predicted
tips:
- Color by row-normalised percentage (recall) but print both count and percentage
- Use a one-hue sequential scale and switch to white text on dark cells
example: A classifier assigning breast-cancer molecular subtypes (synthetic predictions, 600 cases).
read: Each row is a true class, and the diagonal shows the share classified correctly. The biggest error
  is Luminal B predicted as Luminal A (row 2, column 1).
real_data:
  source: "sklearn.datasets.load_breast_cancer() \u2014 Wisconsin diagnostic breast cancer, 569 tumours (malignant = positive), bundled with scikit-learn"
  offline: true
data_shape: [model, categories]
