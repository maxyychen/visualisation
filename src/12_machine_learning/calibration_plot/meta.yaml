title: Calibration (Reliability) Plot
engine: mpl
level: intermediate
order: 30
purpose: Compares predicted probabilities with observed event frequencies, bin by bin. It shows whether
  a model's '30% risk' really means that 30 of 100 such patients have the event.
when_to_use:
- Evaluate clinical risk scores and any model whose probabilities drive decisions
- Check models after recalibration (Platt or isotonic scaling)
- Use alongside ROC/AUC, because a model can rank well and still be badly calibrated
avoid:
- Only the ranking matters, not the probabilities
- The sample is so small that each bin holds only a few cases (use fewer bins or a smoothed curve)
alternatives:
- Brier score (a single number)
- Calibration belt
- Decision curve analysis
tips:
- Show the perfect-calibration diagonal
- Add a histogram of predicted probabilities beneath, so readers see where the data actually lies
example: A well-calibrated logistic regression versus an over-confident Gaussian naive Bayes on the same
  data.
read: 'Points on the diagonal mean the predicted probabilities match reality. The naive Bayes S-curve
  is over-confident: its histogram piles up at 0 and 1.'
data_shape: [model]
