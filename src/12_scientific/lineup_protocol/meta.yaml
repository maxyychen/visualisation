title: Lineup Protocol (visual inference)
engine: mpl
level: advanced
order: 520
data_shape: [time, prices]
purpose: >-
  Hides the real chart among 19 "null" charts generated from data where the pattern cannot exist, for
  example by shuffling the order of returns. If an honest viewer can pick out the real chart, the
  pattern is unlikely to be chance (p ≈ 1/20 = 0.05 for one viewer). The chart becomes a statistical
  test, with human perception as the test statistic.
when_to_use:
  - Check whether a pattern you see (a trend, momentum, clustering, a spatial hot spot) is real or a trick of the eye
  - Test a pattern for which no convenient formal test exists
  - Teach analysts how easily randomness produces convincing-looking patterns
avoid:
  - A standard formal test answers the question directly and the audience trusts it
  - The viewer has already seen the real chart (they will recognise it, which invalidates the test)
  - Final presentation of a result (show the finding itself; keep the lineup in the appendix or the analysis)
alternatives:
  - Rorschach plots (all nulls, to calibrate your eye)
  - A permutation test reported as a number
tips:
  - "What it fixes: our eyes find patterns in noise; the lineup gives an exploratory chart a p-value"
  - Generate nulls that destroy only the pattern you are testing (shuffling returns destroys time dependence but keeps the return distribution)
  - Draw every panel identically (same color, same scales policy) and number them; never highlight the real one
  - With k independent viewers who each pick the real panel, p ≈ (1/20)^k
  - "R implementation by the method's authors: the `nullabor` package"
example: >-
  A simulated weekly price series with momentum (positive autocorrelation in returns) placed at a random
  position among 19 series built by shuffling its own weekly returns. The real-data variant does the same
  with Apple's weekly returns, 2018–2019.
read: >-
  Look for the panel whose path is smoother and trendier than the rest. That is momentum, which shuffling
  destroys. The answer is printed in small type below the figure (panel 15 for the simulated data). With
  the real AAPL returns, most viewers cannot pick the real panel, which is itself the finding: there is
  no visible evidence of momentum in those two years of weekly returns.
reference:
  - text: "Buja, A., Cook, D., Hofmann, H., Lawrence, M., Lee, E.-K., Swayne, D. F. & Wickham, H. (2009). Statistical inference for exploratory data analysis and model diagnostics. Philosophical Transactions of the Royal Society A 367, 4361–4383."
    url: https://doi.org/10.1098/rsta.2009.0120
    year: 2009
  - text: "Wickham, H., Cook, D., Hofmann, H. & Buja, A. (2010). Graphical inference for infovis. IEEE Transactions on Visualization and Computer Graphics 16(6), 973–979."
    url: https://vita.had.co.nz/papers/inference-infovis.html
    year: 2010
real_data:
  source: plotly.express.data.stocks (AAPL weekly returns, 2018–2019)
  offline: true
