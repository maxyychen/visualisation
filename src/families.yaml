- folder: 01_deviation
  name: Deviation
  description: 'Emphasise variations (+/-) from a fixed reference point: zero, a target, or an average.'
- folder: 02_correlation
  name: Correlation
  description: Show the relationship between two or more variables.
- folder: 03_ranking
  name: Ranking
  description: Use when an item's position in an ordered list matters more than its absolute value.
- folder: 04_distribution
  name: Distribution
  description: Show values in a dataset and how often they occur; the shape (skew, spread, gaps) is the story.
- folder: 05_change_over_time
  name: Change over time
  description: Emphasise changing trends, from intraday moves to series spanning decades.
- folder: 06_magnitude
  name: Magnitude
  description: Compare sizes, relative or absolute (usually counts rather than rates).
- folder: 07_part_to_whole
  name: Part-to-whole
  description: Show how a single entity breaks down into its components.
- folder: 08_spatial
  name: Spatial
  description: Use when precise locations or geographic patterns matter more than anything else.
- folder: 09_flow
  name: Flow
  description: Show the volume or intensity of movement between states, stages, or places.
- folder: 10_finance_investment
  name: Finance & investment
  description: Performance, risk, portfolios, markets, rates, derivatives and valuation, the everyday charts of investors and analysts.
  note: Educational examples with simulated or historical data. Not investment advice; past performance does not predict future returns.
- folder: 11_healthcare
  name: Healthcare & life sciences
  description: Clinical trials, survival, oncology, hospital quality and operations, epidemiology and patient-level records.
  note: 'Examples use simulated data. De-identify patient data before analysing it in notebooks: executed notebooks store their outputs.'
- folder: 12_scientific
  name: Scientific
  description: 'Domain-neutral statistics and research plots: effect sizes, meta-analysis, agreement, omics, replicates and visual inference.'
- folder: 13_machine_learning
  name: Machine learning
  description: 'Evaluate and explain fitted models: classification performance, calibration, learning curves, residuals, feature importance and feature effects.'
- folder: 14_uncertainty
  name: Uncertainty
  description: Show what is not known (intervals, probabilities and possible outcomes) so readers do not over-trust a single number.
- folder: 15_bad_vs_good
  name: Bad vs. good
  description: Common chart mistakes, each shown next to a better alternative that fixes it.
- folder: 16_interactive_advanced
  name: Interactive, animated & big data
  description: What-if sliders, linked views, animation and million-point rendering. Use these when exploration or motion adds understanding that a static chart cannot.
