[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vizlib"
version = "0.2.0"
description = "Data visualization library: chart catalogue, shared styles and finance performance tools"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib"]

[tool.setuptools]
packages = ["vizlib"]

[tool.setuptools.package-data]
vizlib = ["gallery_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
